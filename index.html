<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kibitz — Opening Trainer</title>
<style>
:root{
  --bg:#131920; --panel:#1A222A; --panel2:#202B34; --line:#2B3843; --line-soft:#232F39;
  --ink:#E7EDF1; --ink2:#9DAEBA; --ink3:#6C8090;
  --buff:#E6DCC0; --olive:#5C7A54;
  --brass:#CE9B45; --brass-dim:rgba(206,155,69,.16); --brass-line:rgba(206,155,69,.42);
  --rose:#CB6B6B; --rose-dim:rgba(203,107,107,.14);
  --teal:#5EA8A1; --teal-dim:rgba(94,168,161,.16);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(ellipse 90% 60% at 50% -10%,#1B2530 0%,transparent 70%)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1300px;margin:0 auto;padding:20px 20px 40px}
header.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:14px;
  border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{display:flex;align-items:baseline;gap:10px}
.mark{font-size:26px;color:var(--brass);line-height:1;transform:translateY(2px)}
.brand h1{font-family:var(--serif);font-size:27px;font-weight:600;margin:0}
.brand .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);border-left:1px solid var(--line);padding-left:10px}
.top-right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);overflow:hidden}
.seg button{padding:6px 14px;font-size:12px;color:var(--ink2);border-right:1px solid var(--line);transition:.15s}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--panel2);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--brass-dim);color:var(--brass);box-shadow:inset 0 -2px 0 var(--brass)}
.sel-lvl{background:var(--panel);border:1px solid var(--line);color:var(--ink2);padding:6px 8px;
  font-size:12px;font-family:var(--mono)}
#eng-badge{font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:4px 8px;
  border:1px solid var(--line);color:var(--ink3);white-space:nowrap}
#eng-badge.ok{color:var(--teal);border-color:rgba(94,168,161,.4)}
#eng-badge.warn{color:var(--brass);border-color:var(--brass-line)}
#eng-retry{border:1px solid var(--brass-line);color:var(--brass)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
.left{display:flex;gap:14px;align-items:flex-start;min-width:0}
.spine{width:34px;flex:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.spine .num{font-family:var(--mono);font-size:11px;color:var(--ink2);min-height:14px}
.bar{position:relative;width:9px;flex:none;background:#151C23;border:1px solid var(--line);
  overflow:hidden;height:320px}
.bar .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#F2EDE0,#CFC7B4);
  transition:height .4s cubic-bezier(.2,.7,.3,1)}
.bar .mid{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--brass-line)}
.spine .cap{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--ink3);writing-mode:vertical-rl}
.board-col{flex:1;min-width:0;max-width:600px}
.board-frame{position:relative;background:var(--panel2);padding:9px;border:1px solid var(--line)}
/* ---- the board: 8 equal columns AND 8 equal rows, each cell forced square ---- */
.board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  width:100%;aspect-ratio:1/1;user-select:none;touch-action:manipulation}
.sq{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sq.l{background:var(--buff)} .sq.d{background:var(--olive)}
.sq .co{position:absolute;font-family:var(--mono);font-size:9px;opacity:.62;pointer-events:none}
.sq .co.f{right:3px;bottom:1px} .sq .co.r{left:3px;top:1px}
.sq.l .co{color:#7B7154} .sq.d .co{color:#C7D3BE}
/* pieces are drawn as SVG, not font glyphs: some mobile platforms render the
   chess characters with a colour emoji font, which ignores CSS colour and
   turns the white pawns black. */
.pc{display:block;width:100%;height:100%;cursor:pointer;position:relative;z-index:2;
  stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;
  filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35))}
.pc.w{fill:#F6F1E4;stroke:#2A3640}
.pc.b{fill:#1E272E;stroke:#DCE4EA}
.sq.last::after{content:"";position:absolute;inset:0;background:var(--brass);opacity:.26;z-index:1}
.sq.sel::after{content:"";position:absolute;inset:0;background:var(--brass);opacity:.4;z-index:1}
.sq.chk::after{content:"";position:absolute;inset:0;z-index:1;
  background:radial-gradient(circle,rgba(203,60,60,.85) 0%,rgba(203,60,60,.35) 45%,transparent 72%)}
.dot{position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(20,28,34,.34);z-index:1}
.sq.l .dot{background:rgba(60,70,55,.3)}
.ring{position:absolute;inset:7%;border-radius:50%;border:4px solid rgba(20,28,34,.28);z-index:1}
.board svg.arrows{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3}
.sq.hintf::after,.sq.hintt::after{content:"";position:absolute;inset:0;z-index:1;background:var(--teal);opacity:.36}
.sq.bad::after{content:"";position:absolute;inset:0;z-index:1;background:var(--rose);opacity:.45}
.board.shake{animation:shk .34s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}
.promo{position:absolute;inset:0;background:rgba(12,17,22,.86);z-index:9;display:flex;align-items:center;justify-content:center;gap:6px}
.promo button{background:var(--panel2);border:1px solid var(--line);width:58px;height:58px;padding:4px;
  display:flex;align-items:center;justify-content:center}
.promo .pc{filter:none}
/* coach */
.coach{margin-top:12px;border:1px solid var(--line);border-left:2px solid var(--brass);background:var(--panel);
  padding:12px 14px;min-height:84px}
.coach .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--brass);margin-bottom:5px;display:flex;gap:8px;align-items:center}
.coach .lbl .phase{margin-left:auto;color:var(--ink3);letter-spacing:.1em}
.coach p{margin:0;font-size:13.5px}
.coach.ok{border-left-color:var(--teal)} .coach.ok .lbl{color:var(--teal)}
.coach.err{border-left-color:var(--rose)} .coach.err .lbl{color:var(--rose)}
.coach .prev{font-family:var(--serif);font-size:13px;line-height:1.55;color:var(--ink2);
  border-left:1px solid var(--brass-line);padding:3px 0 3px 10px;margin:0 0 9px}
.coach .prev b{font-family:var(--mono);font-size:10.5px;color:var(--brass);font-weight:500;
  display:block;margin-bottom:1px}
.coach .sub{margin-top:6px;font-size:11.5px;color:var(--ink2);font-family:var(--mono)}
.coach .acts{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.mini{border:1px solid var(--line);padding:5px 11px;font-size:11.5px;color:var(--ink2);transition:.15s}
.mini:hover{border-color:var(--brass-line);color:var(--ink);background:var(--panel2)}
.mini.go{border-color:var(--brass-line);color:var(--brass);background:var(--brass-dim)}
.why{margin-top:10px;border-top:1px solid var(--line-soft);padding-top:9px;font-size:12.5px;color:var(--ink2)}
.why b{color:var(--ink)}
.why ul{margin:6px 0 0;padding-left:16px}
.ctrls{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;font-size:12.5px;color:var(--ink2);transition:.15s}
.btn:hover{border-color:var(--brass-line);color:var(--ink);background:var(--panel2)}
.btn:disabled{opacity:.34;cursor:not-allowed}
/* rail */
.rail{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-height:620px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel2)}
.tabs button{flex:1;padding:10px 4px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3);border-right:1px solid var(--line-soft)}
.tabs button:last-child{border-right:none}
.tabs button[aria-selected="true"]{color:var(--brass);background:var(--panel);box-shadow:inset 0 -2px 0 var(--brass)}
.pane{padding:14px 16px;overflow-y:auto;max-height:720px;flex:1}
.pane::-webkit-scrollbar{width:9px}
.pane::-webkit-scrollbar-thumb{background:var(--line)}
.h{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);
  margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line-soft)}
.h:first-child{margin-top:0}
.empty{color:var(--ink3);font-size:13px;font-style:italic;font-family:var(--serif);padding:8px 0}
/* opening picker */
.pick{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);padding:12px 13px;margin-bottom:8px;transition:.15s}
.pick:hover{border-color:var(--brass-line);background:var(--brass-dim)}
.pick .nm{font-family:var(--serif);font-size:17px}
.pick .mv{font-family:var(--mono);font-size:11px;color:var(--brass);margin-top:2px}
.pick .st{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-top:5px}
.pick .barwrap{height:3px;background:var(--line);margin-top:7px}
.pick .barwrap i{display:block;height:100%;background:var(--teal)}
.overall{border:1px solid var(--line);background:var(--panel2);padding:11px 13px;margin-bottom:14px}
.overall .n{font-family:var(--mono);font-size:20px;color:var(--brass)}
.overall .l{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-top:2px}
.overall .barwrap{height:4px;background:var(--line);margin-top:9px}
.overall .barwrap i{display:block;height:100%;background:var(--brass)}
.pick[aria-current="true"]{border-color:var(--brass);background:var(--brass-dim)}
/* lessons */
.lesson{width:100%;display:flex;align-items:center;gap:9px;padding:8px 9px;text-align:left;
  border-left:1px solid var(--line);margin-bottom:3px;transition:.13s}
.lesson:hover{border-left-color:var(--brass);background:var(--panel2)}
.lesson[aria-current="true"]{border-left-color:var(--brass);background:var(--brass-dim)}
.lesson .n{font-family:var(--mono);font-size:10px;color:var(--ink3);min-width:18px}
.lesson .t{font-size:12.5px;flex:1;min-width:0}
.lesson .t small{display:block;color:var(--ink3);font-size:10.5px;font-family:var(--mono)}
.pips{display:flex;gap:3px;flex:none}
.pip{width:15px;height:15px;border:1px solid var(--line);font-family:var(--mono);font-size:9px;
  display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.pip.done{border-color:var(--teal);color:var(--teal);background:var(--teal-dim)}
.pip.now{border-color:var(--brass);color:var(--brass);background:var(--brass-dim)}
.progwrap{height:4px;background:var(--line);margin:8px 0 14px}
.progwrap i{display:block;height:100%;background:var(--teal)}
.card{border:1px solid var(--brass-line);background:var(--brass-dim);padding:13px;margin-bottom:14px}
.card h3{font-family:var(--serif);font-size:16px;margin:0 0 6px}
.card.warn{border-color:var(--rose);background:var(--rose-dim)} .card.warn h3{color:var(--rose)}
.card p{margin:0 0 8px;font-size:12.5px;color:var(--ink2)}
.card .movesx{font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.22);padding:6px 9px;margin-bottom:8px}
.score{font-family:var(--mono);font-size:13px;line-height:1.9}
.score .mn{color:var(--ink3);font-size:11.5px;margin-right:2px}
.mv2{display:inline-block;padding:1px 5px;margin:0 1px 2px 0}
.mv2:hover{background:var(--panel2)}
.mv2[aria-current="true"]{background:var(--brass);color:#171E25;font-weight:600}
.mv2.masked{color:var(--ink3);letter-spacing:.14em;opacity:.5}
.mv2.wrong{color:var(--rose);text-decoration:line-through}
.note{display:block;font-family:var(--serif);font-size:13.5px;line-height:1.62;color:var(--ink2);
  border-left:1px solid var(--brass-line);padding:2px 0 2px 11px;margin:5px 0 9px 6px;font-style:italic}
.note b{color:var(--brass);font-style:normal;font-family:var(--mono);font-size:11px;display:block;margin-bottom:2px;font-weight:500}
.br{width:100%;display:flex;gap:9px;padding:8px 9px;text-align:left;border:1px solid var(--line);
  margin-bottom:5px;background:var(--panel2);transition:.13s;align-items:flex-start}
.br:hover{border-color:var(--brass-line);background:var(--brass-dim)}
.br .san{font-family:var(--mono);font-size:13.5px;color:var(--brass);min-width:52px;font-weight:600}
.br .nmx{font-size:12.5px} .br .sub{font-size:11px;color:var(--ink3);margin-top:1px}
ul.ideas{list-style:none;padding:0;margin:0;counter-reset:i}
ul.ideas li{position:relative;padding-left:24px;margin-bottom:9px;color:var(--ink2);font-size:13px;counter-increment:i}
ul.ideas li::before{content:counter(i);position:absolute;left:0;top:1px;font-family:var(--mono);font-size:10px;
  color:var(--brass);border:1px solid var(--brass-line);width:15px;height:15px;display:flex;
  align-items:center;justify-content:center;border-radius:50%}
.kv{display:grid;grid-template-columns:56px 1fr;gap:6px 10px;font-size:12.5px;color:var(--ink2)}
.kv dt{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--ink3);padding-top:2px}
.cite{border-left:1px solid var(--line);padding-left:11px;margin-bottom:11px}
.cite .w{font-family:var(--serif);font-size:14px;font-style:italic}
.cite .a{font-family:var(--mono);font-size:10.5px;color:var(--brass)}
.cite .n{font-size:12px;color:var(--ink2);margin-top:2px}
.eng-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.eng-row .k{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--ink3)}
.eng-row .v{font-family:var(--mono)}
.pv{font-family:var(--mono);font-size:12px;color:var(--ink2);line-height:1.8;margin-top:10px;background:var(--panel2);
  padding:9px 11px;border-left:1px solid var(--brass-line);word-break:break-word}
footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--ink3);
  font-family:var(--mono);line-height:1.7}
footer a{color:var(--ink2)}
#tip{position:fixed;z-index:99;max-width:290px;background:#0E141A;border:1px solid var(--brass-line);
  padding:8px 11px;font-size:12px;line-height:1.5;color:var(--ink2);pointer-events:none;opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
#tip b{color:var(--brass);font-family:var(--mono);font-size:10.5px;display:block;margin-bottom:3px}
@media (max-width:960px){
  .main{grid-template-columns:1fr}.rail{min-height:0}.pane{max-height:none}
  .board-col{max-width:none}.wrap{padding:14px 14px 40px}.spine{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark">&#9822;</span><h1>Kibitz</h1><span class="tag">Opening Course</span></div>
    <div class="top-right">
      <span id="eng-badge">engine: starting&hellip;</span><button id="eng-retry" class="mini" style="display:none;padding:4px 8px;font-size:10px">retry</button>
      <div class="seg" role="group" aria-label="Mode">
        <button id="mCourse" aria-pressed="true">Course</button>
        <button id="mExplore" aria-pressed="false">Explore</button>
        <button id="mPlay" aria-pressed="false">Play</button>
      </div>
      <select class="sel-lvl" id="level" aria-label="Engine strength">
        <option value="3">Skill 3</option>
        <option value="8" selected>Skill 8</option>
        <option value="14">Skill 14</option>
        <option value="20">Full strength</option>
      </select>
    </div>
  </header>
  <div class="main">
    <div class="left">
      <div class="spine">
        <div class="num" id="evalNum">0.0</div>
        <div class="bar"><div class="mid"></div><div class="fill" id="evalFill" style="height:50%"></div></div>
        <div class="cap">EVAL</div>
      </div>
      <div class="board-col">
        <div class="board-frame">
          <div class="board" id="board"></div>
          <div class="promo" id="promo" style="display:none"></div>
        </div>
        <div class="coach" id="coach">
          <div class="lbl"><span id="coachLbl">Welcome</span><span class="phase" id="coachPhase"></span></div>
          <div class="prev" id="coachPrev" style="display:none"></div>
          <p id="coachTxt">Pick an opening on the right to begin.</p>
          <div class="acts" id="coachActs"></div>
          <div id="whyBox"></div>
        </div>
        <div class="ctrls">
          <button class="btn" id="bShow" title="Reveal the move on the board without playing it">Show me</button>

<script>
/* ============================================================

var Engine = (function () {
  "use strict";

  var EMPTY = 0, PAWN = 1, KNIGHT = 2, BISHOP = 3, ROOK = 4, QUEEN = 5, KING = 6;
  var WHITE = 8, BLACK = 16;

  var KNIGHT_OFF = [-18, -33, -31, -14, 18, 33, 31, 14];
  var BISHOP_OFF = [-17, -15, 17, 15];
  var ROOK_OFF = [-16, -1, 1, 16];
  var KING_OFF = [-17, -16, -15, -1, 1, 15, 16, 17];

  var CASTLE_WK = 1, CASTLE_WQ = 2, CASTLE_BK = 4, CASTLE_BQ = 8;

  /* ---------------- Position ---------------- */

  function Position(fen) {

  Position.prototype.load = function (fen) {

    this.history = [];
    var parts = fen.trim().split(/\s+/);
    var rows = parts[0].split("/");
    for (var r = 0; r < 8; r++) {
      var file = 0;
      for (var k = 0; k < rows[r].length; k++) {
        var ch = rows[r][k];
        if (/[0-9]/.test(ch)) { file += parseInt(ch, 10); continue; }

    this.castling = 0;
    if (parts[2]) {
      if (parts[2].indexOf("K") >= 0) this.castling |= CASTLE_WK;
      if (parts[2].indexOf("Q") >= 0) this.castling |= CASTLE_WQ;
      if (parts[2].indexOf("k") >= 0) this.castling |= CASTLE_BK;
      if (parts[2].indexOf("q") >= 0) this.castling |= CASTLE_BQ;
    }

    this.full = parts[5] ? parseInt(parts[5], 10) : 1;

  };

  Position.prototype.fen = function () {

    if (this.castling & CASTLE_WK) c += "K";
    if (this.castling & CASTLE_WQ) c += "Q";
    if (this.castling & CASTLE_BK) c += "k";
    if (this.castling & CASTLE_BQ) c += "q";

  Position.prototype.clone = function () {

  /* ---------------- Attacks ---------------- */

  Position.prototype.attacked = function (sq, by) {

      if (!off(sq + 17) && b[sq + 17] === (PAWN | WHITE)) return true;
    } else {
      if (!off(sq - 15) && b[sq - 15] === (PAWN | BLACK)) return true;

      s = sq + KNIGHT_OFF[i];

            if (!b[to]) { if (!onlyCaps) out.push(mv(from, to, pc, 0, 0, 0)); }

          out.push(mv(k, k + 2, KING | us, 0, 0, 4));

          out.push(mv(k, k - 2, KING | us, 0, 0, 5));
        }

  };

    if (m.flag === 5) { b[m.to + 1] = b[m.to - 2]; b[m.to - 2] = 0; }

    this.half = h.half; this.full = h.full;

    return m;
  };

  Position.prototype.san = function (m, legalList) {

        s = (m.captured || m.flag === 3) ? FILES[m.from & 15] + "x" + alg(m.to) : alg(m.to);

            if ((o.from >> 4) === (m.from >> 4)) sameRank = true;

    this.killers = [];
  }

  Searcher.prototype.order = function (pos, moves, ttMove, ply) {
    var k1 = this.killers[ply] && this.killers[ply][0];
    var k2 = this.killers[ply] && this.killers[ply][1];
    for (var i = 0; i < moves.length; i++) {
      var m = moves[i], s = 0;
      if (ttMove && m.from === ttMove.from && m.to === ttMove.to && m.promo === ttMove.promo) s = 1000000;
      else if (m.captured) s = 100000 + VAL[type(m.captured)] * 10 - VAL[type(m.piece)];
      else if (m.promo) s = 90000 + VAL[m.promo];
      else if (k1 && m.from === k1.from && m.to === k1.to) s = 80000;
      else if (k2 && m.from === k2.from && m.to === k2.to) s = 79000;
      m._s = s;
    }
    moves.sort(function (a, b) { return b._s - a._s; });
    return moves;
  };

  Searcher.prototype.quiesce = function (pos, alpha, beta) {
    this.nodes++;
    var stand = pos.evaluate();
    if (stand >= beta) return beta;
    if (stand > alpha) alpha = stand;
    var caps = pos.moves(true);
    this.order(pos, caps, null, 0);
    for (var i = 0; i < caps.length; i++) {
      pos.make(caps[i]);
      var sc = -this.quiesce(pos, -beta, -alpha);
      pos.unmake();
      if (sc >= beta) return beta;
      if (sc > alpha) alpha = sc;
    }
    return alpha;
  };

  Searcher.prototype.search = function (pos, depth, alpha, beta, ply) {
    if ((this.nodes & 1023) === 0 && Date.now() > this.deadline) { this.stop = true; }
    if (this.stop) return alpha;
    this.nodes++;
    var inCheck = pos.inCheck();
    if (inCheck) depth++;
    if (depth <= 0) return this.quiesce(pos, alpha, beta);
    var moves = pos.moves();
    if (moves.length === 0) return inCheck ? -MATE + ply : 0;
    if (pos.half >= 100) return 0;
    this.order(pos, moves, null, ply);
    var best = -Infinity, bestMove = null;
    for (var i = 0; i < moves.length; i++) {
      pos.make(moves[i]);
      var sc;
      if (i === 0) sc = -this.search(pos, depth - 1, -beta, -alpha, ply + 1);
      else {
        sc = -this.search(pos, depth - 1, -alpha - 1, -alpha, ply + 1);
        if (sc > alpha && sc < beta) sc = -this.search(pos, depth - 1, -beta, -alpha, ply + 1);
      }
      pos.unmake();
      if (this.stop) return best > -Infinity ? best : alpha;
      if (sc > best) { best = sc; bestMove = moves[i]; }
      if (sc > alpha) alpha = sc;
      if (alpha >= beta) {
        if (!moves[i].captured) {
          if (!this.killers[ply]) this.killers[ply] = [];
          this.killers[ply][1] = this.killers[ply][0];
          this.killers[ply][0] = moves[i];
        }
        break;
      }
    }
    if (ply === 0) this.rootMove = bestMove;

  };

  // Returns {move, san, score, depth, pv}
  function think(pos, opts) {
    opts = opts || {};
    var maxDepth = opts.depth || 4;
    var ms = opts.time || 700;
    var s = new Searcher();
    s.deadline = Date.now() + ms;
    var work = pos.clone();
    var legal = work.moves();
    if (!legal.length) return null;
    var best = legal[0], score = 0, reached = 1;
    for (var d = 1; d <= maxDepth; d++) {
      s.rootMove = null;
      var sc = s.search(work, d, -Infinity, Infinity, 0);
      if (s.stop && d > 1) break;
      if (s.rootMove) { best = s.rootMove; score = sc; reached = d; }
      if (Math.abs(sc) > MATE - 100) break;
    }
    // blunder-prone play for lower levels
    if (opts.randomness) {
      var pool = [];
      var w2 = pos.clone();
      var ml = w2.moves();
      var sc2 = [];
      for (var i = 0; i < ml.length; i++) {
        w2.make(ml[i]);
        var e = -shallow(w2, opts.randomness.depth || 1);
        w2.unmake();
        sc2.push({ m: ml[i], e: e });
      }
      sc2.sort(function (a, b) { return b.e - a.e; });
      var span = opts.randomness.span || 3;
      var top = sc2.slice(0, Math.min(span, sc2.length))
                   .filter(function (x) { return x.e > sc2[0].e - (opts.randomness.window || 120); });
      var pick = top[Math.floor(Math.random() * top.length)];
      if (pick) { best = pick.m; score = pick.e; reached = opts.randomness.depth || 1; }
    }
    var w = pos.clone();
    var sanStr = w.san(best);
    return { move: best, san: sanStr, score: score, depth: reached, nodes: s.nodes };
  }

  function shallow(pos, depth) {
    var s = new Searcher();
    s.deadline = Date.now() + 400;
    return s.search(pos, depth, -Infinity, Infinity, 0);
  }

  // Static evaluation from White's point of view, in centipawns
  function evalCp(pos, opts) {
    opts = opts || {};
    var s = new Searcher();
    s.deadline = Date.now() + (opts.time || 300);
    var work = pos.clone();
    var score = 0;
    for (var d = 1; d <= (opts.depth || 4); d++) {
      var sc = s.search(work, d, -Infinity, Infinity, 0);
      if (s.stop && d > 1) break;
      score = sc;
    }
    return pos.turn === WHITE ? score : -score;

  function perft(pos, depth) {
    if (depth === 0) return 1;
    var moves = pos.moves(), n = 0;
    for (var i = 0; i < moves.length; i++) {
      pos.make(moves[i]);
      n += perft(pos, depth - 1);
      pos.unmake();
    }
    return n;
  }


  /* ---------------- Analysis helpers for move diagnosis ---------------- */

  // Every piece of `by` that attacks `sq`, as piece types.
  function attackerTypes(pos, sq, by) {
    var b = pos.board, out = [], i, s, t;
    if (by === WHITE) {
      if (!off(sq + 15) && b[sq + 15] === (PAWN | WHITE)) out.push(PAWN);
      if (!off(sq + 17) && b[sq + 17] === (PAWN | WHITE)) out.push(PAWN);
    } else {
      if (!off(sq - 15) && b[sq - 15] === (PAWN | BLACK)) out.push(PAWN);
      if (!off(sq - 17) && b[sq - 17] === (PAWN | BLACK)) out.push(PAWN);
    }
    for (i = 0; i < 8; i++) {
      s = sq + KNIGHT_OFF[i];
      if (!off(s) && b[s] === (KNIGHT | by)) out.push(KNIGHT);
      s = sq + KING_OFF[i];
      if (!off(s) && b[s] === (KING | by)) out.push(KING);
    }
    for (i = 0; i < 4; i++) {
      s = sq + BISHOP_OFF[i];
      while (!off(s)) {
        if (b[s]) { t = type(b[s]);
          if (color(b[s]) === by && (t === BISHOP || t === QUEEN)) out.push(t);
          break; }
        s += BISHOP_OFF[i];
      }
      s = sq + ROOK_OFF[i];
      while (!off(s)) {
        if (b[s]) { t = type(b[s]);
          if (color(b[s]) === by && (t === ROOK || t === QUEEN)) out.push(t);
          break; }
        s += ROOK_OFF[i];
      }
    }
    return out;
  }

  // Is the piece on `sq` loose? Returns null or {piece, cheapest}
  function looseAt(pos, sq) {
    var pc = pos.board[sq];
    if (!pc) return null;
    var us = color(pc), them = other(us);
    var att = attackerTypes(pos, sq, them);
    if (!att.length) return null;
    var def = attackerTypes(pos, sq, us);
    var cheapest = att.reduce(function (a, t) { return Math.min(a, VAL[t] || 0); }, 99999);
    if (!def.length) return { piece: type(pc), cheapest: cheapest, undefended: true };
    if (cheapest < VAL[type(pc)]) return { piece: type(pc), cheapest: cheapest, undefended: false };
    return null;
  }

  // All of `side`'s pieces that are currently loose, worst first.
  function loosePieces(pos, side) {
    var out = [];
    for (var r = 0; r < 8; r++) for (var f = 0; f < 8; f++) {
      var i = r * 16 + f, pc = pos.board[i];
      if (!pc || color(pc) !== side) continue;
      var l = looseAt(pos, i);
      if (l) out.push({ sq: i, type: type(pc), info: l });
    }
    out.sort(function (a, b) { return (VAL[b.type] || 0) - (VAL[a.type] || 0); });
    return out;
  }

  function pieceName(t) {
    return { 1: "pawn", 2: "knight", 3: "bishop", 4: "rook", 5: "queen", 6: "king" }[t];
  }

  function materialCount(pos, side) {
    var n = 0;
    for (var r = 0; r < 8; r++) for (var f = 0; f < 8; f++) {
      var pc = pos.board[r * 16 + f];
      if (pc && color(pc) === side) n += VAL[type(pc)] || 0;
    }
    return n;
  }

  return {
    Position: Position, perft: perft, think: think, evalCp: evalCp,
    attackerTypes: attackerTypes, looseAt: looseAt, loosePieces: loosePieces,
    pieceName: pieceName, materialCount: materialCount, VAL: VAL,
    alg: alg, fromAlg: fromAlg, type: type, colorOf: color,
    WHITE: WHITE, BLACK: BLACK, PAWN: PAWN, KNIGHT: KNIGHT, BISHOP: BISHOP,
    ROOK: ROOK, QUEEN: QUEEN, KING: KING, SYM: SYM
  };
})();

     notes:{6:"Modest, and the reason 4.Ng5 has declined at top level: White keeps a pull with no risk.",16:"The knight tour begins. From d2 the knight goes f1 then g3 or e3.",19:"Black mirrors with ...Ne7–g6. A long manoeuvring game in which understanding beats memory."}},

    {id:"it-semi",name:"Semi-Italian (3...d6)",eco:"C50",v:"⩲",
     gist:"Black shores up e5 first and heads for a Hungarian-style set-up with ...Bg4.",
     moves:"e4 e5 Nf3 Nc6 Bc4 d6 d4 exd4 Nxd4 Nf6 Nc3 Be7 O-O O-O h3 Nxd4 Qxd4 c6",
     notes:{5:"Solid but slow. Black concedes the centre in return for a position with no weaknesses.",6:"White must take the chance to build the big centre.",14:"h3 first, taking the ...Bg4 pin away before Black gets it in.",17:"A small but stable White edge in space. Black is passive but hard to crack."}}
  ],
  traps:[
    {name:"Legal's Mate",kind:"forced",pre:"e4 e5 Nf3 Nc6 Bc4 d6 Nc3",bad:"Bg4",
     why:"Pinning the knight looks natural, but the pin is fake: the queen behind it is worth less than the mating net in front of it. White gives up the queen with Nxe5 and finishes with three minor pieces. Sire de Legal played it in Paris around 1750 and it has been catching players ever since \u2014 the root cause is that Black has made two pawn moves and one bishop move while White has three pieces out.",
     pun:"h3 Bh5 Nxe5 Bxd1 Bxf7+ Ke7 Nd5#",
     best:"Nf6",bestWhy:"Just develop. 4...Nf6 is fine, and if you want the pin later, play it only when Nxe5 does not come with tempo on f7."},
    {name:"Blackburne Shilling Gambit",kind:"forced",pre:"e4 e5 Nf3 Nc6 Bc4 Nd4 Nxe5 Qg5",bad:"Nxf7",
     why:"Grabbing e5 is playable, but only if White then keeps his head. The queen sortie hits the knight and g2 at once, and the natural fork on f7 loses to mate in four: the queen infiltrates on g2, the rook is deflected, and the knight on d4 delivers mate on f3. Blackburne is said to have won shillings from London amateurs with exactly this.",
     pun:"Qxg2 Rf1 Qxe4+ Be2 Nf3#",
     best:"Bxf7+",bestWhy:"6.Bxf7+! is the refutation of the whole gambit: after 6...Kd8 7.O-O White is a clean pawn up and the black king is stranded. Better still, decline at move four with 4.c3 or 4.Nxd4."},
    {name:"Italian Gambit: taking with the knight",kind:"forced",pre:"e4 e5 Nf3 Nc6 Bc4 Bc5 d4",bad:"Nxd4",
     why:"Recapturing with the knight abandons e5 and leaves f7 attacked twice. White wins the pawn back with a fork on the king and rook available in several lines.",
     pun:"Nxe5 Ne6 Bxe6 fxe6 Qh5+ g6",
     best:"Bxd4",bestWhy:"4...Bxd4! is best — Black trades off the attacker of f7 and equalises comfortably after 5.Nxd4 Nxd4."},
    {name:"Fried Liver invitation",kind:"practical",pre:"e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5",bad:"Nxd5",
     why:"The natural recapture is the one move theory rejects. The knight on d5 is pinned against the king by the c4 bishop, which is exactly what makes the sacrifice on f7 work. Lawrence Trent calls it a well-known bad move.",
     pun:"Nxf7 Kxf7 Qf3+ Ke6 Nc3",
     caveat:"Engines defend this position for Black and rate him a piece up. It is a practical weapon, not a refutation \u2014 which is why the modern preference is the quiet 6.d4 (the Lolli).",
     best:"Na5",bestWhy:"5...Na5! is the Polerio Defence and the main line: Black gives the pawn back to chase the bishop off the a2–g8 diagonal, which removes the whole sacrifice."},
    {name:"Møller: one greedy move too many",kind:"practical",pre:"e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4 exd4 cxd4 Bb4+ Nc3 Nxe4 O-O Nxc3 bxc3 Bxc3 Qb3",bad:"Bxa1",
     why:"There is a difference between taking a pawn and taking a rook. Once the bishop goes to a1 it is out of play for the rest of the game, and White crashes through on f7 with a winning attack. Black can defend more stubbornly than the classical line below, but he is playing without a bishop and against every piece White owns — the textbook illustration of development over material.",
     pun:"Bxf7+ Kf8 Bg5 Ne7 Ne5 Bxd4 Bg6",
     caveat:"Black is a rook up here and a computer would defend it. Over the board, against Bg5, Ne5 and Bg6 with the king on f8, almost nobody does.",
     best:"d5",bestWhy:"Black must stop grabbing and play 10...d5!, returning material to block the b3–f7 diagonal and complete development."}
  ]
},
{
  id:"ruy", name:"Ruy López", aka:"The Spanish Game", eco:"C60–C99",
  opener:"1.e4 e5 2.Nf3 Nc6 3.Bb5", side:"white",
  summary:"The oldest and deepest of the open games. White's third move does not really threaten to win the e5 pawn — it prepares to. The bishop leans on c6, and every Black defence is an answer to the question of how long that pressure can be tolerated.",
  ideas:[
    "The threat of Bxc6 is positional, not tactical: doubling Black's c-pawns in exchange for the bishop pair.",
    "White's slow build-up — c3, d4, Nbd2–f1–g3 — reroutes the queen's knight to the kingside. Learn the manoeuvre, not the move order.",
    "Black's counterplay almost always comes from ...b5 and ...c5, gaining queenside space while the centre stays locked.",
    "The d5 square is the strategic prize. Whoever controls it usually controls the game.",
    "Every Black third move alternative — Berlin, Schliemann, Classical, Steinitz — is a different answer to the same question: how to handle the pin without ...a6."
  ],
  structure:"Closed centre with pawns on e4/d4 against e5/d6. Black's c-pawn and White's queenside are the levers.",
  plans:{white:"Play d4 at the right moment, keep the centre tense, manoeuvre the b1-knight to g3 or f5, then attack on the kingside.",black:"Expand with ...b5, ...c5, ...Na5; either hit d4 with the c-pawn or blockade in a Chigorin structure."},
  pitfall:"Believing the bishop is trapping something. 3...a6 4.Bxc6 dxc6 5.Nxe5?? loses the pawn back to 5...Qd4 forking e4 and e5.",
  reading:[
    {work:"The Ideas Behind the Chess Openings",author:"Reuben Fine",note:"The classic short explanation of why White plays Bb5 at all."},
    {work:"Mastering the Chess Openings, Vol. 1",author:"John Watson",note:"Modern reassessment of the Closed Spanish and the knight tour."},
    {work:"The Modernized Ruy Lopez",author:"Dariusz Swiercz",note:"Contemporary White repertoire covering every Black third-move alternative."}
  ],
  lines:[
    {id:"ruy-closed",name:"Closed / Chigorin",eco:"C96–C99",v:"⩲",
     gist:"The main highway. Both sides castle, both complete development, and the real game begins around move eleven.",
     moves:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 d6 c3 O-O h3 Na5 Bc2 c5 d4 Qc7 Nbd2 cxd4 cxd4 Nc6",
     notes:{5:"The Morphy Defence. Black asks the bishop to declare itself before committing anything else.",10:"Re1 renews the threat on e5 for real: the rook backs the pawn, so Bxc6 and Nxe5 becomes genuine.",11:"Forced in effect. Without ...b5 White really does win a pawn.",14:"The quiet move that defines the opening: c3 builds the big centre and gives the bishop c2.",16:"Prophylaxis before expansion — h3 stops ...Bg4 before d4 arrives.",17:"Chigorin's idea. The knight looks offside but it removes White's best bishop or reroutes via c6.",20:"The moment White has prepared for since move eight.",25:"Black has completed the standard regrouping and the middlegame is balanced and rich."}},

    {id:"ruy-breyer",name:"Breyer Variation",eco:"C95",v:"=",
     gist:"The knight goes all the way back to b8 to be rebuilt on d7. Bizarre-looking, and one of the soundest systems in chess.",
     moves:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 d6 c3 O-O h3 Nb8 d4 Nbd7 Nbd2 Bb7 Bc2 Re8 Nf1 Bf8",
     notes:{17:"The Breyer. Gyula Breyer's idea: the knight was doing nothing on c6, so it returns to be redeployed to d7 where it supports e5 and c5.",19:"Now the knight reaches its best square and the bishop can come to b7 without being blocked.",21:"The bishop takes the long diagonal, pressing on e4.",25:"A model Spanish structure: every black piece has a job. Spassky, Kasparov and Kramnik all made this their main defence."}},

    {id:"ruy-zaitsev",name:"Zaitsev Variation",eco:"C92",v:"⇄",
     gist:"Black plays ...Bb7 and ...Re8 in the other order, offering White a repetition — and a sharper game if declined.",
     moves:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 d6 c3 O-O h3 Bb7 d4 Re8 Ng5 Rf8 Nf3 Re8 d5 Nb8",
     notes:{17:"The Zaitsev, Karpov's long-time weapon. The bishop takes the long diagonal at once.",19:"...Re8 pressures e4 and supports the coming ...Bf8.",20:"White can force a repetition here with Ng5 — Black must decide whether to accept a draw or deviate with 11...Rf8.",24:"Closing the centre. Now the game becomes a slow manoeuvring battle on both wings."}},

    {id:"ruy-marshall",name:"Marshall Attack",eco:"C89",v:"∞",
     gist:"Black gives a whole pawn for a lasting initiative against h2. A century of analysis has not refuted it.",
     moves:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 O-O c3 d5 exd5 Nxd5 Nxe5 Nxe5 Rxe5 c6 d4 Bd6 Re1 Qh4",
     notes:{13:"Black castles instead of ...d6, keeping the d-pawn free for a double step.",15:"The Marshall. Frank Marshall unveiled it against Capablanca in 1918 and lost, but the idea outlived the game.",19:"White accepts. Declining with 11.Rxe5 is the main line; 11.d4 or an Anti-Marshall on move eight avoids all of it.",25:"The queen arrives and Black has ...Bg4, ...Rae8 and a permanent initiative for the pawn. Many elite players avoid the whole thing with 8.a4 or 8.h3."}},

    {id:"ruy-antimarshall",name:"Anti-Marshall (8.a4)",eco:"C88",v:"⩲",
     gist:"White sidesteps the Marshall entirely by hitting b5 before Black can play ...d5.",
     moves:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 O-O a4 Bb7 d3 d6 Nc3 Na5 Ba2 c5 Nd5 Nxd5 exd5",
     notes:{14:"a4 immediately. Black must attend to the queenside before dreaming of ...d5.",16:"d3 rather than c3 — a modern, flexible treatment aiming at a slow squeeze.",18:"Nc3 is possible precisely because c3 is not needed for d4.",24:"White has a small structural pull with no risk whatsoever. This is why the Marshall is rarer at elite level than its reputation suggests."}},

    {id:"ruy-open",name:"Open Spanish",eco:"C80–C83",v:"=",
     gist:"Black grabs e4 and accepts an unbalanced structure for free piece play.",
     moves:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Nxe4 d4 b5 Bb3 d5 dxe5 Be6 c3 Bc5 Nbd2 O-O Bc2 Nxf2 Rxf2 f6",
     notes:{9:"The Open Variation. Black takes the pawn and prepares to hold the knight on e4 with ...d5.",10:"The critical reply. White must open the centre before Black consolidates.",13:"Now the knight on e4 is a proud outpost and Black has a real share of the centre.",21:"The Dilworth Attack — Black gives back the piece for a raging attack. A line where knowing the theory is everything."}},

    {id:"ruy-berlin",name:"Berlin Defence",eco:"C65–C67",v:"=",
     gist:"The Berlin Wall. Queens come off by move eight and Black's bishop pair balances a wrecked structure.",
     moves:"e4 e5 Nf3 Nc6 Bb5 Nf6 O-O Nxe4 d4 Nd6 Bxc6 dxc6 dxe5 Nf5 Qxd8+ Kxd8 Nc3 Ke8 h3 h5 Bf4 Be6",
     notes:{5:"Instead of asking the bishop, Black counterattacks e4 immediately.",7:"The point: e4 is only loosely defended and Re1 is not yet played.",11:"Black must recapture towards the centre; ...bxc6 leaves the king stuck.",15:"Black loses the right to castle but the queens are gone, so the king walks to e8 and helps in the endgame.",19:"...h5 grabs space and stops g4. Kramnik's use of this structure against Kasparov in 2000 changed elite opening theory."}},

    {id:"ruy-berlin-antiberlin",name:"Anti-Berlin (4.d3)",eco:"C65",v:"⩲",
     gist:"White declines the endgame and keeps queens on with a slow Italian-style build-up.",
     moves:"e4 e5 Nf3 Nc6 Bb5 Nf6 d3 Bc5 c3 O-O O-O d6 Nbd2 a6 Ba4 Ba7 h3 Ne7 Re1 Ng6 Nf1 c6",
     notes:{6:"The modern answer to the Berlin: keep the tension and avoid the drawish endgame.",12:"The familiar knight tour. This structure is nearly identical to the Italian Pianissimo.",17:"Black mirrors the manoeuvre with ...Ne7–g6.",21:"A rich middlegame with all the pieces on. This is how Carlsen and Caruana play the Berlin today."}},

    {id:"ruy-exchange",name:"Exchange Variation",eco:"C68–C69",v:"=",
     gist:"White cashes in immediately: a healthy kingside majority and a long endgame grind.",
     moves:"e4 e5 Nf3 Nc6 Bb5 a6 Bxc6 dxc6 O-O f6 d4 exd4 Nxd4 c5 Nb3 Qxd1 Rxd1 Bd7 Bf4 O-O-O",
     notes:{5:"Lasker's and later Fischer's choice. White gives up the bishop pair for a structural asset.",7:"Recapturing towards the centre. ...bxc6 would be structurally worse.",8:"Not 5.Nxe5 — 5...Qd4 wins the pawn back with a good game.",9:"Solid and necessary. Black props up e5 and accepts a clumsy kingside.",13:"Gaining space and time, but conceding d5 permanently.",19:"The famous imbalance: White's clean 4-v-3 kingside majority makes a passer, Black's doubled c-pawn majority cannot. Black's answer is to keep pieces on and use the two bishops."}},

    {id:"ruy-schliemann",name:"Schliemann (Jaenisch Gambit)",eco:"C63",v:"∞",
     gist:"3...f5 — a King's Gambit in reverse. Objectively suspect, wildly dangerous in practice.",
     moves:"e4 e5 Nf3 Nc6 Bb5 f5 Nc3 fxe4 Nxe4 d5 Nxe5 dxe4 Nxc6 Qg5 Qe2 Nf6 f4 Qxf4 Ne5+ c6 d4 Qh4+ g3 Qh3",
     notes:{5:"The Schliemann. Black hits e4 immediately and accepts serious risk for the initiative.",6:"The critical test. 4.d3 is the safe positional answer.",13:"The queen emerges with tempo and Black's pieces come alive.",22:"A famous forcing sequence with the black queen deep in White's camp. Modern theory judges it about balanced — but a single slip either way is fatal."}},

    {id:"ruy-classical",name:"Classical (Cordel) Defence",eco:"C64",v:"⩲",
     gist:"3...Bc5, one of the oldest replies. Black develops actively and dares White to prove anything.",
     moves:"e4 e5 Nf3 Nc6 Bb5 Bc5 c3 Nf6 O-O O-O d4 Bb6 Re1 d6 h3 Ne7 Bd3 Ng6 Nbd2 c6 Nf1 Re8",
     notes:{5:"The Cordel or Classical. Before Morphy popularised 3...a6 this and the Berlin were the standard replies.",6:"c3 first, preparing d4 with the bishop already committed to c5.",11:"Retreating to keep the bishop's diagonal. Black must not allow d4–d5 with tempo.",20:"A comfortable Spanish structure for both. White has a nagging space edge, Black has no weaknesses."}},

    {id:"ruy-steinitz",name:"Steinitz Defence",eco:"C62",v:"⩲",
     gist:"3...d6, solid and cramped. Steinitz's own defence, largely retired after 1918 for being too passive.",
     moves:"e4 e5 Nf3 Nc6 Bb5 d6 d4 Bd7 Nc3 Nf6 O-O Be7 Re1 exd4 Nxd4 Nxd4 Qxd4 Bxb5 Nxb5 O-O",
     notes:{5:"The Old Steinitz. Black defends e5 at once and accepts a passive position.",12:"Re1 sets up the Tarrasch Trap: if Black castles now, 9.Bxc6 Bxc6 10.dxe5 wins a pawn because of the pin down the e-file.",13:"So Black must release the tension first. This is the concession the whole variation is built around.",19:"White has more space and easier development. Playable for Black, but the modern preference is the deferred version with 3...a6 4.Ba4 d6."}},

    {id:"ruy-bird",name:"Bird's Defence",eco:"C61",v:"⩲",
     gist:"3...Nd4 challenges the bishop immediately and gives Black a doubled d-pawn that is stronger than it looks.",
     moves:"e4 e5 Nf3 Nc6 Bb5 Nd4 Nxd4 exd4 O-O Bc5 d3 c6 Ba4 Ne7 f4 d6 Nd2 O-O Nf3 Bb6",
     notes:{5:"Bird's Defence. Rare, but it takes the opponent out of book immediately.",7:"Black gets a protected pawn on d4 that cramps White's queenside pieces.",13:"The knight goes to e7 rather than f6 to avoid e4–e5 tricks.",19:"White has the freer game and the extra central pawn's mobility; Black's d4 wedge gives real counterplay."}},

    {id:"ruy-modernsteinitz",name:"Modern Steinitz (4...d6)",eco:"C71–C76",v:"=",
     gist:"The deferred version: because ...a6 is in, Black meets d4 with ...b5 and the Noah's Ark motif is available.",
     moves:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 d6 c3 Bd7 d4 Nf6 O-O Be7 Re1 O-O Nbd2 Re8 Nf1 Bf8 Ng3 g6",
     notes:{7:"The Modern or Neo-Steinitz. Far freer than the old version because ...b5 is always available.",8:"c3 rather than d4 immediately — White has learned to prepare, since the direct 5.d4 runs into Noah's Ark ideas.",16:"The standard Spanish rerouting once more.",21:"Black builds the ...Bg7 set-up behind the pawn chain. A tough, flexible structure."}}
  ],
  traps:[
    {name:"Noah's Ark Trap",kind:"forced",pre:"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 d6 d4 b5 Bb3 Nxd4 Nxd4 exd4",bad:"Qxd4",
     why:"Recapturing on d4 looks like it just regains the pawn, but the queen is exposed to ...c5 with tempo and the bishop on b3 has nowhere to sail — ...c5 and ...c4 build a pawn cage around it. Capablanca won this way against Steiner in 1929; Alekhine had actually recommended the losing move in a tournament book.",
     pun:"c5 Qd5 Be6 Qc6+ Bd7 Qd5 c4",
     best:"c3",bestWhy:"White should play 5.c3 or 5.O-O rather than the immediate 5.d4, keeping the bishop's retreat available before opening the position."},
    {name:"Tarrasch Trap (Steinitz Defence)",kind:"forced",pre:"e4 e5 Nf3 Nc6 Bb5 d6 d4 Bd7 Nc3 Nf6 O-O Be7 Re1",bad:"O-O",

    {name:"The Exchange pawn-grab",kind:"forced",pre:"e4 e5 Nf3 Nc6 Bb5 a6 Bxc6 dxc6",bad:"Nxe5",
     why:"The e5 pawn is only apparently free. Black regains it immediately with a central queen fork hitting the knight on e5 and the pawn on e4, and White has simply given up the bishop pair for nothing.",
     pun:"Qd4 Nf3 Qxe4+",
     best:"O-O",bestWhy:"5.O-O is the move. White banks the structural advantage of the doubled c-pawns and plays for the long-term endgame."}
  ]

{
  id:"sicilian", name:"Sicilian Defence", aka:"The Great Fighting Defence", eco:"B20–B99",
  opener:"1.e4 c5", side:"black",
  summary:"Black declines symmetry from move one. The c-pawn is traded for White's d-pawn, giving Black a central pawn majority and a half-open c-file in exchange for less space and slower development. It is the most-played and most-analysed defence in chess, and it branches at move two.",
  ideas:[
    "The structural bargain: Black swaps a wing pawn for a centre pawn. The half-open c-file is Black's main artery for counterplay.",
    "In the Open Sicilian White usually attacks on the kingside and Black on the queenside. When kings castle on opposite wings, count tempi and not pawns.",
    "The d5 square is the perpetual battleground. Black spends the whole game trying to play ...d5 in one go; White spends it preventing that.",
    "Black's queenside expansion runs ...a6, ...b5, ...b4 to dislodge the c3 knight — the defender of both e4 and d5. Remove it and ...d5 arrives.",
    "White's standard attacking scheme is Be3, f3, Qd2, O-O-O and g4–g5. Recognise it and Black's defensive job becomes concrete rather than vague.",
    "Because it is so heavily analysed, most White players avoid the Open Sicilian entirely. Expect the Alapin, Rossolimo and Grand Prix far more often than the Najdorf."
  ],
  structure:"Black pawns on d6/e6 or d6/e5 against White's e4; half-open c-file for Black, half-open d-file for White.",
  plans:{white:"Open Sicilian: f3, Be3, Qd2, O-O-O and a pawn storm with g4–g5. Or sidestep with c3, Bb5 or the Closed set-up.",black:"Pressure the c-file with ...Rc8, hit the c3 knight with ...b5–b4, and break with ...d5 the moment it is playable."},
  pitfall:"Playing the Sicilian as a system rather than a set of concrete lines. In sharp variations one move-order slip loses on the spot — and the most common practical error is grabbing a pawn while three pieces are still at home.",
  reading:[
    {work:"Mastering the Chess Openings, Vol. 2",author:"John Watson",note:"The best explanatory chapters on the Sicilian's pawn skeletons."},
    {work:"Experts vs. the Sicilian",author:"Dearing, Aagaard et al.",note:"Anti-Sicilian coverage from the White side, variation by variation."},
    {work:"The Sveshnikov Reloaded",author:"Dorian Rogozenco",note:"Model treatment of the Sveshnikov's voluntary weaknesses."},
    {work:"Winning with the Najdorf",author:"Daniel King",note:"Plan-based rather than variation-based introduction to the main line."}
  ],
  lines:[
    /* ---------- Najdorf ---------- */
    {id:"sic-naj-english",name:"Najdorf: English Attack",eco:"B90",v:"⇄",
     gist:"The modern main line. White sets up Be3, f3, Qd2, O-O-O and storms with g4; Black races with ...b5.",
     moves:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Be3 e5 Nb3 Be6 f3 Be7 Qd2 O-O O-O-O Nbd7 g4 b5 g5 b4",
     notes:{5:"Black must challenge the centre or be squeezed. This trade is the Open Sicilian's defining moment.",7:"Hitting e4 and forcing White to commit the queen's knight.",9:"The Najdorf move. It looks like a beginner's pawn push; it stops Bb5+ and Nb5 forever and prepares ...b5.",10:"The English Attack set-up, named for Nunn, Short and Chandler who developed it in the 1980s.",11:"Grabbing the centre and kicking the knight, at the cost of the d5 square. This is the Najdorf's permanent bargain.",13:"Covering d5 with the bishop, the square Black just weakened.",14:"f3 props up e4 and prepares g4 — the whole attacking plan in one modest move.",18:"Castling into the coming storm. Now it is a pure race.",20:"The storm begins.",23:"...b4 hits the knight that guards d5 and e4. If it is driven away, ...d5 follows and Black is fine."}},

    {id:"sic-naj-poisoned",name:"Najdorf: Poisoned Pawn",eco:"B97",v:"∞",
     gist:"Black snatches b2 with the queen while three pieces sleep. Fischer's speciality and still theoretically sound.",
     moves:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Bg5 e6 f4 Qb6 Qd2 Qxb2 Rb1 Qa3 e5 dxe5 fxe5 Nfd7 Ne4",
     notes:{10:"The old main line. The pin on f6 is White's most direct way to fight for d5.",12:"f4 prepares e5 and gives the queen access to f3.",13:"The Poisoned Pawn. Black attacks b2 and d4 at once — and rejects every principle of development.",15:"Taking it. Fischer played this repeatedly, including in the 1972 World Championship match.",17:"The queen must find a safe square; a3 is the only one.",18:"White opens the centre against the uncastled king. This is the compensation.",22:"Extremely forcing from here. Both sides are following analysis twenty-five moves deep; the modern verdict is a draw with perfect play."}},

    {id:"sic-naj-6bg5be7",name:"Najdorf: 6.Bg5 Be7 Main Line",eco:"B94–B96",v:"⇄",
     gist:"The classical treatment: Black declines the poisoned pawn, develops, and White launches g4–g5 and f5.",
     moves:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Bg5 e6 f4 Be7 Qf3 Qc7 O-O-O Nbd7 g4 b5 Bxf6 Nxf6 g5 Nd7 f5",
     notes:{13:"Solid and sensible. Black completes development instead of raiding b2.",14:"Qf3 supports e4 and prepares to castle long — this queen often swings to g3 or h3 later.",18:"The bayonet. White has no intention of a quiet game.",20:"Removing the defender of d5 before pushing the g-pawn.",24:"f5 attacks the base of Black's e6/d6 chain. Meanwhile Black plays ...Bb7, ...b4 and ...Nc5. Sharp, mutual, and decided by preparation."}},

    {id:"sic-naj-sozin",name:"Najdorf: Fischer–Sozin (6.Bc4)",eco:"B87",v:"⇄",
     gist:"The bishop takes aim at f7 and e6. Fischer's favourite way to meet the Najdorf as White.",
     moves:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Bc4 e6 Bb3 b5 O-O Be7 Qf3 Qc7 Qg3 O-O Bh6 Ne8",
     notes:{10:"Bc4 immediately. The bishop eyes the a2–g8 diagonal, which is exactly where Black is weakest.",11:"Necessary. Black must blunt the diagonal before doing anything else.",12:"Retreating in advance, so that ...b5 never comes with tempo.",16:"Qf3 and Qg3 is the standard regrouping, adding a piece to the kingside attack.",20:"Bh6 provokes a weakening or wins the dark-squared bishop. Black must defend precisely.",21:"...Ne8 is the awkward but correct defence, holding g7."}},

    {id:"sic-naj-opocensky",name:"Najdorf: Opočenský (6.Be2)",eco:"B92",v:"⩲",
     gist:"The quiet, positional Najdorf. White forgoes the attack and plays against the d5 hole for the next forty moves.",
     moves:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Be2 e5 Nb3 Be7 O-O O-O Be3 Be6 Qd2 Nbd7 a4 Rc8",
     notes:{10:"Modest development. Karpov's preferred handling — no risk, permanent small pressure.",11:"Black takes the centre and the d5 hole appears, as always in this structure.",18:"Qd2 rather than f3 and g4; White will double on the d-file and manoeuvre Na5 or Nd5.",20:"a4 stops ...b5 and takes away Black's main source of counterplay. This single move is the essence of the whole variation."}},

    {id:"sic-naj-adams",name:"Najdorf: Adams Attack (6.h3)",eco:"B90",v:"⩲",
     gist:"A modern computer-influenced try: h3 first, then g4 in one go without spending a move on f3.",
     moves:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 h3 e5 Nde2 Be7 g4 b5 Ng3 Bb7 Bg2 Nbd7 O-O Rc8",
     notes:{10:"h3 supports g4 without weakening the a7–g1 diagonal the way f3 does.",12:"Nde2 rather than Nb3 — the knight heads for g3 to join the kingside play.",14:"The point: g4 arrives having cost only one preparatory move.",21:"White has a space edge and a natural attack; Black has the usual queenside play. A popular elite choice since roughly 2018."}},

    /* ---------- Dragon ---------- */
    {id:"sic-dragon-yugo",name:"Dragon: Yugoslav Attack (9.Bc4)",eco:"B77–B79",v:"⇄",
     gist:"The sharpest race in chess, summarised as: castle queenside, push the h-pawn, pry open the h-file, mate.",
     moves:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 g6 Be3 Bg7 f3 O-O Qd2 Nc6 Bc4 Bd7 O-O-O Rc8 Bb3 Ne5 h4 h5",
     notes:{9:"The Dragon fianchetto. The bishop on g7 is the strongest piece on the board and the reason Black survives.",12:"f3 is essential — it stops ...Ng4 hitting the bishop and supports the coming g4/h4.",16:"Bc4 is the Yugoslav refinement: it stops ...d5 and stares at f7.",19:"The Dragon rook lift. Often ...Rxc3 is a positional exchange sacrifice that shatters White's king cover.",22:"The h-pawn starts running.",23:"...h5 is the standard brake. It costs a tempo but stops h5 and keeps the h-file shut for now."}},

    {id:"sic-dragon-soltis",name:"Dragon: Yugoslav 9.O-O-O d5",eco:"B76",v:"=",
     gist:"Black gets the central break in immediately. The critical test of White's whole set-up.",
     moves:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 g6 Be3 Bg7 f3 O-O Qd2 Nc6 O-O-O d5 exd5 Nxd5 Nxc6 bxc6 Bd4 e5",
     notes:{16:"Castling long without Bc4 — so Black gets the freeing break at once.",17:"The move the whole Dragon is played for. Timing is everything: one move earlier or later and it fails.",19:"Now White must not allow ...Nxe3 and ...Qxd2 with a comfortable game.",22:"Bd4 offers the trade of Black's proudest piece. This is the critical positional moment.",23:"...e5 kicks the bishop and keeps the g7 bishop alive. Theory considers the resulting positions balanced."}},

    {id:"sic-dragon-classical",name:"Dragon: Classical (6.Be2)",eco:"B70–B74",v:"=",
     gist:"White declines the storm and plays a normal game. Much less theory, and Black's Dragon bishop is less useful without a target.",
     moves:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 g6 Be2 Bg7 O-O O-O Be3 Nc6 Nb3 Be6 f4 Qc8 Kh1 Rd8",
     notes:{10:"Be2 and short castling. White plays for a small edge instead of a knockout.",16:"Nb3 prepares f4–f5 and takes the knight out of the way of the g7 bishop.",19:"...Qc8 connects the rooks and supports ...Bh3 ideas.",20:"Kh1 is standard prophylaxis, stepping off the a7–g1 diagonal before playing f5 or g4."}},

    {id:"sic-accel-maroczy",name:"Accelerated Dragon: Maróczy Bind",eco:"B36–B39",v:"⩲",
     gist:"Black saves a tempo by omitting ...d6; White answers with the c4/e4 bind and a long positional squeeze.",
     moves:"e4 c5 Nf3 Nc6 d4 cxd4 Nxd4 g6 c4 Bg7 Be3 Nf6 Nc3 O-O Be2 d6 O-O Bd7 Qd2 Nxd4 Bxd4 Bc6 f3 a5",
     notes:{7:"The accelerated fianchetto. By skipping ...d6 Black hopes for ...d5 in one move.",8:"The Maróczy Bind. Pawns on c4 and e4 take d5 and b5 away permanently — this is the price of the acceleration.",19:"Trading a pair of knights to relieve the cramp. In bind positions the defender wants exchanges and the attacker avoids them.",21:"The bishop reaches its ideal diagonal, pressing on e4.",23:"...a5 stops b4 and secures c5 for a knight. Black is solid but must be patient."}},

    {id:"sic-accel-classical",name:"Accelerated Dragon: 5.Nc3",eco:"B35",v:"=",
     gist:"White declines the bind and plays a normal Dragon set-up — but Black's extra tempo tells.",
     moves:"e4 c5 Nf3 Nc6 d4 cxd4 Nxd4 g6 Nc3 Bg7 Be3 Nf6 Bc4 O-O Bb3 d6 f3 Bd7 Qd2 Rc8 O-O-O Ne5",
     notes:{8:"Allowing the Dragon structure. Now Black has not committed the d-pawn, which matters.",13:"Black castles first, because the immediate ...Ng4 is answered by Bb5+.",21:"A Yugoslav Attack where Black has effectively gained a tempo over the normal Dragon — one reason many White players prefer 5.c4."}},

    /* ---------- Classical / Rauzer ---------- */
    {id:"sic-rauzer",name:"Richter–Rauzer",eco:"B60–B69",v:"⇄",
     gist:"White pins the f6 knight and castles long. The main line against the Classical Sicilian for eighty years.",
     moves:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 Nc6 Bg5 e6 Qd2 a6 O-O-O Bd7 f4 Be7 Nf3 b5 Bxf6 gxf6 f5 Qb6",
     notes:{9:"The Classical Sicilian: Black develops naturally and keeps every structure available.",10:"The Rauzer. White prevents the Dragon set-up by pinning the knight before Black can play ...g6.",13:"...a6 prepares ...b5 and gives the queen the c7 square.",18:"Retreating the knight to keep the f-pawn free — a standard Rauzer regrouping.",20:"Trading on f6 wrecks Black's structure but hands over the g-file and the two bishops.",22:"f5 pressures e6. Both sides are attacking; Black's doubled f-pawns actually reinforce the centre."}},

    {id:"sic-sozin-velimirovic",name:"Sozin / Velimirović Attack",eco:"B87–B89",v:"⇄",
     gist:"Bc4, Qe2, O-O-O and a piece storm at e6 and f7. One of the most violent attacking systems in the Sicilian.",
     moves:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 Nc6 Bc4 e6 Be3 Be7 Qe2 O-O O-O-O a6 Bb3 Qc7 g4 Nd7",
     notes:{10:"The Sozin. The bishop points at the weakest square in Black's camp.",14:"Qe2 and O-O-O is Velimirović's addition — the queen supports the g4 push and the rook comes to d1 or g1.",18:"Retreating the bishop before ...b5 arrives with tempo.",20:"The storm. White is attacking with every piece; Black must generate queenside play immediately or be mated."}},

    {id:"sic-boleslavsky",name:"Boleslavsky Variation",eco:"B58",v:"=",
     gist:"Black plays ...e5 and accepts the d5 hole in return for space and a free game — the idea that made the whole Najdorf structure respectable.",
     moves:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 Nc6 Be2 e5 Nb3 Be7 O-O O-O Be3 Be6 f3 a5 a4 Nb4",
     notes:{11:"Boleslavsky's revolutionary idea from the 1940s: the d5 hole is worth less than the space and activity Black gets.",18:"...a5 is the key follow-up, gaining queenside space and heading for b4.",20:"a4 stops the pawn but concedes b4 permanently.",21:"The knight occupies the hole White just created. A model illustration of how holes work both ways."}},

    /* ---------- Scheveningen ---------- */
    {id:"sic-keres",name:"Scheveningen: Keres Attack",eco:"B81",v:"⇄",
     gist:"g4 on move six, before castling or developing. The reason most players now reach the Scheveningen via the Najdorf move order.",
     moves:"e4 c5 Nf3 e6 d4 cxd4 Nxd4 Nf6 Nc3 d6 g4 h6 h4 Nc6 Rg1 d5 Bb5 Bd7 exd5 Nxd5 Nxd5 exd5",
     notes:{9:"The Scheveningen 'small centre' with pawns on d6 and e6. Flexible and resilient.",10:"The Keres Attack. White attacks before developing at all — the most testing line in the whole variation.",11:"Stopping g5. The alternative 6...h5 is also played.",14:"Rg1 supports the g-pawn's advance; White may never castle.",15:"Black strikes in the centre, the standard answer to a wing attack.",21:"An open position where both kings are loose. Sharp and roughly balanced."}},

    {id:"sic-scheveningen-classical",name:"Scheveningen: Classical (6.Be2)",eco:"B84–B85",v:"⩲",
     gist:"The model 'small centre' game: White expands with f4 and Black waits for ...d5 or ...b5.",
     moves:"e4 c5 Nf3 e6 d4 cxd4 Nxd4 Nf6 Nc3 d6 Be2 Be7 O-O O-O f4 Nc6 Be3 Bd7 Nb3 a6 a4 Qc7",
     notes:{10:"Quiet development. This is the Scheveningen most players actually face.",14:"f4 gains space and prepares e5 or f5.",18:"Nb3 unblocks the d-file and prepares a4 and Bf3.",20:"a4 again — the standard cure for ...b5. Black's counterplay must now come through ...Rfc8 and ...Na5 or the ...d5 break."}},

    /* ---------- Sveshnikov family ---------- */
    {id:"sic-sveshnikov",name:"Sveshnikov Main Line",eco:"B33",v:"⇄",
     gist:"Black voluntarily takes a hole on d5 and a doubled f-pawn, and gets ferocious piece activity in return.",
     moves:"e4 c5 Nf3 Nc6 d4 cxd4 Nxd4 Nf6 Nc3 e5 Ndb5 d6 Bg5 a6 Na3 b5 Bxf6 gxf6 Nd5 f5 Bd3 Be6 Qh5 Bg7",
     notes:{9:"Once considered simply bad — it hangs d5 and d6. Sveshnikov and the Chelyabinsk analysts proved the activity is worth it.",10:"The knight jumps to b5 hitting d6, the immediate justification for White's play.",13:"Kicking the knight to the edge. On a3 it is offside for several moves — Black's compensation begins here.",14:"...b5 gains the queenside space that defines Black's counterplay.",17:"Doubling Black's pawns, but opening the g-file and reinforcing e5.",19:"The thematic break. Black plays for ...f4, ...Bg7 and pressure down the g-file. Carlsen used this in the 2018 World Championship match."}},

    {id:"sic-sveshnikov-novosibirsk",name:"Sveshnikov: 9.Bxf6 gxf6 10.Nd5 f5 11.c3",eco:"B33",v:"=",
     gist:"White plays the modest c3 to secure d5 and prepare Nc2. The main positional test.",
     moves:"e4 c5 Nf3 Nc6 d4 cxd4 Nxd4 Nf6 Nc3 e5 Ndb5 d6 Bg5 a6 Na3 b5 Bxf6 gxf6 Nd5 f5 c3 Bg7 exf5 Bxf5",
     notes:{20:"c3 prepares Nc2–e3 and gives the knight on a3 a route back into the game. Slow, solid, and the reason the Sveshnikov requires precision.",22:"Trading on f5 to fix Black's structure before Black can play ...f4.",23:"Black recaptures with the bishop and retains the pair, with play against d5 and down the g-file."}},

    {id:"sic-kalashnikov",name:"Kalashnikov Variation",eco:"B32",v:"=",
     gist:"The Sveshnikov's cousin: ...e5 one move earlier, without committing the king's knight.",
     moves:"e4 c5 Nf3 Nc6 d4 cxd4 Nxd4 e5 Nb5 d6 N1c3 a6 Na3 b5 Nd5 Nge7 c4 Nd4 cxb5 Nxb5",
     notes:{7:"...e5 immediately. Black gains time on the knight but concedes d5 without having developed the king's knight yet.",10:"N1c3 — the queen's knight must go around because b5 is occupied.",13:"The familiar queenside expansion, hitting the knight and gaining space.",17:"...Nd4 is the key resource, planting a knight in the middle of the board to offset the d5 outpost."}},

    /* ---------- Taimanov / Kan ---------- */
    {id:"sic-taimanov",name:"Taimanov Variation",eco:"B44–B49",v:"=",
     gist:"Flexible development with ...Nc6 and ...Qc7, delaying every pawn commitment. Black keeps ...d5 and ...d6 both available.",
     moves:"e4 c5 Nf3 e6 d4 cxd4 Nxd4 Nc6 Nc3 Qc7 Be3 a6 Qd2 Nf6 O-O-O Bb4 f3 Ne5 Nb3 b5",
     notes:{7:"The Taimanov. Black develops the knight before deciding on the pawn structure.",9:"...Qc7 eyes the c-file and e5, and keeps the d-pawn's options open.",15:"...Bb4 pins the knight that guards d5 and e4 — the standard Taimanov idea.",17:"...Ne5 heads for c4 to hit the queen and the bishop.",19:"Mutual attacks on opposite wings, with Black a shade faster than in the classical lines."}},

    {id:"sic-kan",name:"Kan (Paulsen) Variation",eco:"B41–B43",v:"⩲",
     gist:"...a6 first and everything else later. The most flexible Sicilian of all, and the lowest-theory of the main Open lines.",
     moves:"e4 c5 Nf3 e6 d4 cxd4 Nxd4 a6 Bd3 Nf6 O-O Qc7 Qe2 d6 c4 g6 Nc3 Bg7 Rd1 O-O",
     notes:{7:"The Kan. Black stops Bb5 and Nb5 and waits to see what White commits to.",8:"Bd3 rather than Nc3, keeping the c-pawn free for the bind.",14:"The Maróczy-style bind. White takes d5 and b5 away and plays for a positional squeeze.",18:"White has more space; Black has a solid, flexible position with ...Nbd7, ...Rb8 and ...b5 to come."}},

    {id:"sic-fourknights",name:"Sicilian Four Knights",eco:"B45",v:"=",
     gist:"Both sides develop all four knights, then White's Ndb5 forces the issue immediately.",
     moves:"e4 c5 Nf3 e6 d4 cxd4 Nxd4 Nf6 Nc3 Nc6 Ndb5 Bb4 a3 Bxc3+ Nxc3 d5 exd5 exd5 Bd3 O-O O-O d4",
     notes:{10:"Ndb5 hits d6 and threatens Nd6+. Black must answer immediately.",11:"...Bb4 defends d6 by pinning the knight that would support it.",15:"Black gets the freeing break in one move — the whole point of this variation.",21:"...d4 gains space and kicks the knight. Black has an isolated d-pawn but full activity; theory calls it equal."}},

    /* ---------- Anti-Sicilians ---------- */
    {id:"sic-alapin-nf6",name:"Alapin: 2...Nf6",eco:"B22",v:"=",
     gist:"White sidesteps the whole Open Sicilian and builds a classical centre. Low theory, real chances.",
     moves:"e4 c5 c3 Nf6 e5 Nd5 d4 cxd4 Nf3 Nc6 cxd4 d6 Bc4 Nb6 Bb5 dxe5 Nxe5 Bd7 Nxd7 Qxd7 Nc3 e6",
     notes:{2:"Preparing d4 so that after ...cxd4 White recaptures with the c-pawn and keeps two centre pawns.",3:"The critical reply, attacking e4 at once.",4:"Gaining a tempo — but the knight is comfortable on d5 for now.",12:"Bc4 hits the knight and eyes f7.",14:"Bb5 pins the knight against the king, preparing to undermine e5's defenders.",21:"Balanced, but White has a clear plan and Black has to know a little theory too."}},

    {id:"sic-alapin-d5",name:"Alapin: 2...d5",eco:"B22",v:"=",
     gist:"The simplest antidote: hit the centre at once and accept a Scandinavian-style position a tempo up on the usual version.",
     moves:"e4 c5 c3 d5 exd5 Qxd5 d4 Nf6 Nf3 Bg4 Be2 e6 h3 Bh5 O-O Nc6 Be3 cxd4 cxd4 Be7 Nc3 Qd6",
     notes:{3:"Striking immediately. Because White has played c3 rather than Nc3, the queen cannot be chased with tempo.",5:"Note the difference from the Scandinavian proper: no Nc3 is available, so Black keeps the queen centralised for free.",9:"Pinning the knight to increase the pressure on d4 — Black's main target for the rest of the game.",21:"An isolated queen's pawn position where Black is comfortably equal and White must play energetically."}},

    {id:"sic-rossolimo-g6",name:"Rossolimo: 3...g6",eco:"B31",v:"⩲",
     gist:"White trades on c6 and plays against the doubled pawns; Black gets the bishop pair and a solid dark-square grip.",
     moves:"e4 c5 Nf3 Nc6 Bb5 g6 Bxc6 dxc6 d3 Bg7 h3 Nf6 Nc3 O-O Be3 b6 Qd2 e5 O-O Qe7",
     notes:{4:"The Rossolimo. Extremely popular at elite level precisely because it avoids the Open Sicilian's theory.",6:"Taking immediately, before Black can play ...Bg7 and recapture comfortably.",7:"Recapturing towards the centre. ...bxc6 is possible but concedes more.",8:"d3 rather than d4 — White keeps the position closed, where Black's bishop pair matters least.",10:"h3 stops ...Bg4 and prepares Be3 without allowing ...Ng4.",19:"White has a small, durable edge; Black has the two bishops and will look to open the position with ...f5."}},

    {id:"sic-rossolimo-e6",name:"Rossolimo: 3...e6",eco:"B30",v:"=",
     gist:"Black prepares ...Nge7 to recapture on c6 with a piece and keep a clean structure.",
     moves:"e4 c5 Nf3 Nc6 Bb5 e6 O-O Nge7 Re1 a6 Bf1 d5 exd5 Nxd5 d4 cxd4 Nxd4 Nxd4 Qxd4 Nf6",
     notes:{5:"...e6 keeps the structure flexible and prepares ...Nge7.",7:"The point: after Bxc6 Black recaptures with the knight and has no doubled pawns.",10:"Bf1 retreats rather than trading, a modern idea borrowed from the Spanish.",11:"...d5 in one move — Black has fully equalised.",19:"Symmetrical and balanced. This is why 3...e6 is the choice of the well-prepared."}},

    {id:"sic-moscow",name:"Moscow Variation (3.Bb5+)",eco:"B51–B52",v:"⩲",
     gist:"The 2...d6 equivalent of the Rossolimo. White trades off a piece and plays a low-risk positional game.",
     moves:"e4 c5 Nf3 d6 Bb5+ Bd7 Bxd7+ Qxd7 c4 Nf6 Nc3 Nc6 d4 cxd4 Nxd4 g6 f3 Bg7 Be3 O-O",
     notes:{4:"The Moscow. Black's cleanest answer is ...Bd7; ...Nd7 and ...Nc6 are also playable.",7:"Recapturing with the queen keeps the structure intact.",8:"The Maróczy Bind again. This is White's main way to fight for an advantage here.",19:"A bind position where White has space and Black has a solid, if passive, game. Patience decides it."}},

    {id:"sic-grandprix",name:"Grand Prix Attack",eco:"B23",v:"=",
     gist:"f4 and a direct kingside attack. Immensely popular at club level and genuinely dangerous if Black is careless.",
     moves:"e4 c5 Nc3 Nc6 f4 g6 Nf3 Bg7 Bb5 Nd4 O-O a6 Bd3 d6 Nxd4 cxd4 Ne2 e5 c3 Ne7",
     notes:{4:"The Grand Prix. White plans Bc4 or Bb5, O-O, and then f5 or a queen swing to the kingside.",5:"The main defence — Black fianchettoes to blunt the attack along the long diagonal.",8:"Bb5 is the modern preference over Bc4, since it removes a defender before f5 arrives.",9:"...Nd4 is the standard equaliser, hitting b5 and centralising.",19:"Black has met the attack head-on and stands fine. The Grand Prix is much less feared than it was in the 1980s."}},

    {id:"sic-closed",name:"Closed Sicilian",eco:"B25–B26",v:"=",
     gist:"White fianchettoes and plays a slow kingside build-up. Spassky's weapon: almost no theory, all understanding.",
     moves:"e4 c5 Nc3 Nc6 g3 g6 Bg2 Bg7 d3 d6 f4 e6 Nf3 Nge7 O-O O-O Be3 Nd4 Qd2 Rb8",
     notes:{4:"The Closed. White declines d4 entirely and treats it like a reversed King's Indian.",10:"f4 and later f5 or g4 is the plan; the g2 bishop supports the centre.",13:"...Nge7 rather than ...Nf6, keeping the long diagonal open and preparing ...Nd4.",17:"...Nd4 is Black's standard outpost, blocking the file and daring White to trade.",19:"...Rb8 begins the queenside expansion with ...b5. Both sides attack on their own wing; understanding beats memory."}},

    {id:"sic-smithmorra",name:"Smith–Morra Gambit Accepted",eco:"B21",v:"∞",
     gist:"A pawn for two open files and a huge lead in development. Dangerous below master level, respectable above it.",
     moves:"e4 c5 d4 cxd4 c3 dxc3 Nxc3 Nc6 Nf3 d6 Bc4 e6 O-O Nf6 Qe2 Be7 Rd1 e5 Be3 O-O",
     notes:{2:"The gambit. White offers a pawn to open the c- and d-files.",5:"Accepting is critical. Declining with 3...Nf6 or 3...d3 is a legitimate way to duck the whole thing.",10:"Bc4 and Qe2 with rooks to c1 and d1 is the standard set-up — memorise the scheme, not the moves.",16:"...e5 blunts the pressure on the d-file and secures d4 for a piece.",19:"White has real compensation but no more than that. Black's job is to trade pieces and reach an endgame a pawn up."}},

    {id:"sic-morra-declined",name:"Smith–Morra Declined (3...Nf6)",eco:"B21",v:"=",
     gist:"Refusing the pawn transposes to a favourable Alapin structure where White's c3 is already committed.",
     moves:"e4 c5 d4 cxd4 c3 Nf6 e5 Nd5 cxd4 d6 Nf3 Nc6 Bc4 Nb6 Bb5 dxe5 Nxe5 Bd7 Nxd7 Qxd7",
     notes:{5:"Declining. Black transposes into an Alapin where White has spent a move on d4 and cannot avoid the trade.",7:"The knight is comfortable on d5 and White has no gambit compensation.",19:"A completely sound position for Black — this is why well-prepared opponents rarely take the pawn."}}
  ],
  traps:[
    {name:"O'Kelly: the automatic 3.d4",kind:"positional",pre:"e4 c5 Nf3 a6",bad:"d4",
     why:"Not a blunder \u2014 an inaccuracy, and a good illustration of why move order matters. The whole point of 2...a6 is that it takes b5 away from the knight, so after the usual trade Black plays ...e5 with tempo and White's knight has no good square. Against 2...a6 the Open Sicilian is simply less attractive than usual.",
     pun:"cxd4 Nxd4 e5 Nb3 Nf6 Nc3 Bb4",
     best:"c3",bestWhy:"3.c3 or 3.Bc4 is the point. Transpose to an Alapin, where ...a6 is a wasted move rather than a useful one."},
    {name:"Magnus Smith Trap",kind:"forced",pre:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 Nc6 Bc4 g6 Nxc6 bxc6 e5",bad:"dxe5",
     why:"The whole sequence starts with 6...g6, which is the wrong reaction to a bishop on c4: it does nothing about the a2\u2013g8 diagonal. Once the c6 knight is exchanged and the e-pawn advances, recapturing opens the diagonal with the king still on e8, and the bishop check wins the queen outright. Named after the Canadian champion who demonstrated it around 1900.",
     pun:"Bxf7+ Kxf7 Qxd8",
     best:"Nd7",bestWhy:"8...Nd7 is forced, and after 9.exd6 exd6 10.O-O White is simply better. The real fix is earlier: play 6...e6 to blunt the diagonal before fianchettoing."},
    {name:"Najdorf: the truly poisoned pawn",kind:"forced",pre:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Bg5 e6 f4 Qb6 a3",bad:"Qxb2",
     why:"Against 8.Qd2 the b2 pawn really is edible. Against 8.a3 it is not: the modest rook's pawn means the knight can swing to a4 and the black queen has no square to run to. The lesson is that the same capture is brilliant or losing depending on one quiet preparatory move.",
     pun:"Na4 Qxa1 Qxa1",
     best:"Be7",bestWhy:"Against 8.a3 Black should simply develop. The pawn is not going anywhere and the queen belongs back on c7."},
    {name:"Siberian Trap",kind:"forced",pre:"e4 c5 d4 cxd4 c3 dxc3 Nxc3 Nc6 Nf3 e6 Bc4 Qc7 O-O Nf6 Qe2 Ng4",bad:"h3",
     why:"The natural kick loses the queen outright. Black's knight lands on d4 with a discovered attack on the queen and a mate threat on h2 at the same time — the queen and the mate cannot both be answered. Declining the knight does not help either \u2014 White simply loses a piece instead. It has caught players in tournament practice at least three times.",
     pun:"Nd4 Nxd4 Qh2#",
     best:"Nb5",bestWhy:"9.Nb5! is the recommended move, hitting the queen and gaining the tempo White needs to defend h2.",
     side:"white"},
    {name:"Dragon: the premature ...Ng4",kind:"forced",pre:"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 g6 Be3",bad:"Ng4",
     why:"Hitting the bishop looks like it wins the pair, but the knight on c6 is not yet developed, so the b5 square is available with check. White wins a piece because the knight on g4 has no defender and the king must respond first.",
     pun:"Bb5+ Bd7 Qxg4",
     best:"Bg7",bestWhy:"6...Bg7 first. In the Dragon, ...Ng4 only works once ...Nc6 has taken the b5 square away."},
    {name:"Alapin: recapturing before trading",kind:"forced",pre:"e4 c5 c3 d5 exd5 Qxd5 d4 Nc6 Nf3 Bg4 Be2 cxd4 cxd4 Nxd4 Nxd4",bad:"Qxd4",
     why:"Black wins the pawn correctly but takes the pieces back in the wrong order. With a bishop still sitting on g4 unprotected, recapturing on d4 hands White a free tempo to snap it off. Always resolve the loose piece first — this is the most common way club players lose material in an equal position.",
     pun:"Bxg4",
     best:"Bxe2",bestWhy:"8...Bxe2! first. After 9.Qxe2 Qxd4 the position is completely equal — the same pawn, without giving away a bishop."},
    {name:"The fork trick that isn't",kind:"forced",pre:"e4 c5 Nf3 Nc6 d4 cxd4 Nxd4 Nf6 Nc3",bad:"Nxe4",
     why:"In the Italian and the Four Knights, grabbing on e4 works because ...d5 forks back. Here it fails: after the knights come off, ...d5 is answered by taking on c6, and the pawn that recaptures blocks the fork. Black ends up a clean piece down. The lesson is that a tactical pattern is only valid in the exact structure that supports it.",
     pun:"Nxe4 d5 Nxc6 bxc6 Ng3",
     best:"e5",bestWhy:"Any normal move keeps the balance \u2014 5...e5 is the Sveshnikov, 5...d6 the Classical, 5...e6 the Four Knights. There is simply no need for a tactic here."}
  ]

{
  id:"vienna", name:"Vienna Game", aka:"Vienna Gambit", eco:"C25\u2013C29",
  opener:"1.e4 e5 2.Nc3", side:"white",
