<script>
(function(){
"use strict";
var E=Engine;
var PNAME={1:"pawn",2:"knight",3:"bishop",4:"rook",5:"queen",6:"king"};
/* Pieces come from the <symbol> set at the top of the document rather than
   from Unicode chess characters: mobile browsers hand U+265F and friends to
   the colour emoji font, which paints them black whatever the CSS says. */
function pieceSvg(type,white){
  return '<svg class="pc '+(white?"w":"b")+'" viewBox="0 0 45 45" role="img" aria-label="'+
    (white?"white ":"black ")+PNAME[type]+'"><use href="#pc'+type+'"/></svg>';
}

/* ============================================================
   Analyzer — Stockfish in a worker, with the built-in engine
   as a fallback. Everything is async and serialised.
   ============================================================ */
var Analyzer=(function(){
  var SRC=["https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js",
           "https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js"];
  var w=null,ready=false,kind="builtin",srcIdx=0,onReady=[],pending=null,seq=0,name="";
  function badge(){
    var el=document.getElementById("eng-badge");if(!el)return;
    el.textContent="engine: "+(ready?(kind==="sf"?(name||"Stockfish"):"built-in (offline)"):"starting\u2026");
    el.className=ready?(kind==="sf"?"ok":"warn"):"";
    var rb=document.getElementById("eng-retry");
    if(rb)rb.style.display=(ready&&kind!=="sf")?"inline-block":"none";
  }
  function retry(){
    if(w){try{w.terminate();}catch(e){}w=null;}
    ready=false;srcIdx=0;kind="builtin";badge();
    boot();
  }
  function boot(){
    if(srcIdx>=SRC.length){kind="builtin";ready=true;badge();flush();return;}
    var url=SRC[srcIdx++],blob,u;
    try{
      blob=new Blob(["importScripts('"+url+"');"],{type:"application/javascript"});
      u=URL.createObjectURL(blob);
      w=new Worker(u);
    }catch(e){ boot(); return; }
    var settled=false;
    var timer=setTimeout(function(){ if(settled)return; settled=true;
      try{w.terminate();}catch(e){} w=null; boot(); },12000);
    w.onerror=function(){ if(settled)return; settled=true; clearTimeout(timer);
      try{w.terminate();}catch(e){} w=null; boot(); };
    w.onmessage=function(ev){
      var line=typeof ev.data==="string"?ev.data:(ev.data&&ev.data.data)||"";
      if(!settled){
        if(/^id name /.test(line)) name=line.slice(8).split(" ").slice(0,2).join(" ");
        if(line==="uciok"){ settled=true; clearTimeout(timer); kind="sf"; ready=true;
          post("setoption name Hash value 32");
          post("setoption name Contempt value 0");   // objective, side-independent scores
          post("ucinewgame"); badge(); flush(); }
        return;
      }
      handle(line);
    };
    post("uci");
  }
  function post(s){ if(w) try{w.postMessage(s);}catch(e){} }
  function flush(){ var q=onReady.slice();onReady=[];q.forEach(function(f){f();}); }
  function handle(line){
    if(!pending)return;
    var m;
    if(/\b(lowerbound|upperbound)\b/.test(line)){ /* aspiration bound: not a real score */ }
    else if((m=/^info .*\bdepth (\d+)\b.*\bscore (cp|mate) (-?\d+)/.exec(line))){
      pending.depth=+m[1];
      if(m[2]==="cp"){pending.cp=+m[3];pending.mate=null;}else{pending.mate=+m[3];pending.cp=null;}
      var pv=/\bpv (.+)$/.exec(line); if(pv)pending.pv=pv[1].trim().split(/\s+/);
    }
    if((m=/^bestmove (\S+)/.exec(line))){
      var p=pending;pending=null;
      p.best=m[1]==="(none)"?null:m[1];
      p.cb(p);
      next();
    }
  }
  var queue=[];
  function next(){
    if(pending||!queue.length)return;
    var job=queue.shift();
    if(kind!=="sf"){ runBuiltin(job); return; }
    pending={cb:job.cb,cp:0,mate:null,depth:0,pv:[],id:job.id};
    post("position fen "+job.fen);
    post(job.movetime?("go movetime "+job.movetime):("go depth "+(job.depth||14)));
  }
  function runBuiltin(job){
    setTimeout(function(){
      var pos=new E.Position(job.fen),r=null;
      try{r=E.think(pos,{depth:Math.min(job.depth||4,5),time:job.movetime||600});}catch(e){}
      var cp=0;try{cp=E.evalCp(pos,{depth:3,time:250});}catch(e){}
      job.cb({best:r?E.alg(r.move.from)+E.alg(r.move.to)+(r.move.promo?"q":""):null,
              cp:pos.turn===E.WHITE?cp:-cp,mate:null,depth:r?r.depth:2,pv:[],id:job.id});
      next();
    },10);
  }
  function go(fen,opts,cb){
    opts=opts||{};
    var job={fen:fen,depth:opts.depth,movetime:opts.movetime,skill:opts.skill,cb:cb,id:++seq};
    if(!ready){ onReady.push(function(){queue.push(job);next();}); return job.id; }
    if(opts.skill!=null&&kind==="sf") post("setoption name Skill Level value "+opts.skill);
    queue.push(job); next(); return job.id;
  }
  function cancel(){ queue.length=0; if(pending&&kind==="sf"){post("stop");} }
  boot();
  return {go:go,cancel:cancel,isSF:function(){return kind==="sf";},ready:function(){return ready;},
          retry:retry,
          onReady:function(f){ready?f():onReady.push(f);}};
})();

/* score, from White's point of view, given whose turn it is */
function whiteCp(res,turn){
  if(res.mate!=null) return (res.mate>0?1:-1)*(turn===E.WHITE?1:-1)*100000;
  var cp=res.cp||0; return turn===E.WHITE?cp:-cp;
}
function fmtCp(cp){
  if(Math.abs(cp)>=90000) return cp>0?"+M":"-M";
  return (cp>0?"+":"")+(cp/100).toFixed(2);
}
function uciToMove(pos,uci){
  if(!uci||uci.length<4)return null;
  var promo=uci.length>4?{q:5,r:4,b:3,n:2}[uci[4]]:0;
  return pos.moveFromSquares(E.fromAlg(uci.slice(0,2)),E.fromAlg(uci.slice(2,4)),promo);
}
function uciLineToSan(fen,ucis,max){
  var p=new E.Position(fen),out=[];
  for(var i=0;i<ucis.length&&i<(max||8);i++){
    var m=uciToMove(p,ucis[i]);if(!m)break;
    out.push(p.san(m));p.make(m);
  }
  return out;
}

/* ============================================================
   Repertoire indexing
   ============================================================ */
if(typeof MORE!=="undefined")BOOK.forEach(function(op){if(MORE[op.id])op.lines=op.lines.concat(MORE[op.id]);});
function fenKey(p){var f=p.fen().split(" ");return f[0]+" "+f[1]+" "+f[2]+" "+f[3];}
function buildTree(op){
  var root={kids:{},order:[],lines:[],depth:0};
  op.lines.forEach(function(ln){
    var toks=ln.moves.trim().split(/\s+/),n=root;
    for(var i=0;i<toks.length;i++){
      var san=toks[i];
      if(!n.kids[san]){n.kids[san]={san:san,kids:{},order:[],lines:[],depth:i+1};n.order.push(san);}
      n=n.kids[san];
      if(n.lines.indexOf(ln.id)<0)n.lines.push(ln.id);
      if(ln.notes&&ln.notes[i]!=null&&n.note==null)n.note=ln.notes[i];
    }
    n.terminal=ln.id;
  });
  return root;
}
if(typeof SIDELINES!=="undefined")BOOK.forEach(function(op){
  if(SIDELINES[op.id])op.traps=(op.traps||[]).concat(SIDELINES[op.id]);
});
BOOK.forEach(function(op){
  op._tree=buildTree(op); op._byId={};
  op.lines.forEach(function(l){op._byId[l.id]=l;});
  op._traps={};
  (op.traps||[]).forEach(function(t){
    var p=new E.Position(),ok=true;
    t.pre.trim().split(/\s+/).forEach(function(s){var m=p.moveFromSan(s);if(!m){ok=false;return;}p.make(m);});
    if(ok){var k=fenKey(p);(op._traps[k]=op._traps[k]||[]).push(t);}
    // who blunders here? if it is the opponent, this is a drillable sideline
    var plies=t.pre.trim().split(/\s+/).length;
    var moverIsWhite=(plies%2===0);
    var studentIsWhite=(op.side!=="black");
    t._opponentErrs=(moverIsWhite!==studentIsWhite);
  });
  // a drill is only useful if some lesson actually reaches its position
  op._sides=(op.traps||[]).filter(function(t){
    if(!t._opponentErrs)return false;
    var pre=t.pre.trim();
    return op.lines.some(function(l){var mv=l.moves.trim();return mv===pre||mv.indexOf(pre+" ")===0;});
  });
});
function sidelinesFor(op,lesson){
  if(!op._sides||!lesson)return [];
  var mv=lesson.moves.trim();
  return op._sides.filter(function(t){
    var pre=t.pre.trim();
    return mv===pre||mv.indexOf(pre+" ")===0;
  });
}

/* ============================================================
   State
   ============================================================ */
var S={
  mode:"course", tab:"course", op:null,
  lesson:null,           // line object being taught
  phase:"learn",         // learn | test
  pos:new E.Position(), path:[], node:null,
  student:"white",       // side the user plays
  orient:"white", sel:-1, legal:[], last:null, hint:0, badSq:-1,
  right:0, wrong:0, mistakes:[], finished:false, arrow:null,
  drills:[], drillIdx:0, drillSeq:[], drillStep:0, drillWrong:0,
  busy:false, gen:0, timer:null, engineInfo:null, progress:{}, lastEval:0
};
var Store=(function(){
  // Three tiers, tried in order, each guarded so a blocked API can never
  // break the app: browser localStorage (a downloaded file), the host
  // storage API (running inside Claude), then memory only.
  var KEY="kibitz.progress.v1", mode="memory", mem=null;
  function localOK(){
    try{
      var t="__kibitz_probe__";
      window.localStorage.setItem(t,"1");
      window.localStorage.removeItem(t);
      return true;
    }catch(e){return false;}
  }
  if(localOK())mode="local";
  else{ try{ if(window.storage)mode="host"; }catch(e){} }
  function save(obj){
    var json;
    try{ json=JSON.stringify(obj); }catch(e){ return; }
    mem=json;
    if(mode==="local"){ try{ window.localStorage.setItem(KEY,json); }catch(e){} }
    else if(mode==="host"){ try{ window.storage.set(KEY,json).catch(function(){}); }catch(e){} }
  }
  function load(cb){
    if(mode==="local"){
      var raw=null;
      try{ raw=window.localStorage.getItem(KEY); }catch(e){}
      cb(parse(raw)); return;
    }
    if(mode==="host"){
      try{
        window.storage.get(KEY).then(function(r){ cb(parse(r&&r.value)); })
          .catch(function(){ cb(null); });
      }catch(e){ cb(null); }
      return;
    }
    cb(parse(mem));
  }
  function parse(raw){
    if(!raw)return null;
    try{ var o=JSON.parse(raw); return (o&&typeof o==="object")?o:null; }catch(e){ return null; }
  }
  function clear(){
    mem=null;
    if(mode==="local"){ try{ window.localStorage.removeItem(KEY); }catch(e){} }
    else if(mode==="host"){ try{ window.storage.delete(KEY).catch(function(){}); }catch(e){} }
  }
  function label(){
    return mode==="local"?"saved in this browser":
           mode==="host"?"saved to your Claude session":"not saved (this browser blocks storage)";
  }
  return {save:save,load:load,clear:clear,mode:function(){return mode;},label:label};
})();
function persist(){
  Store.save({v:1,progress:S.progress,
    last:S.op?{op:S.op.id,lesson:S.lesson?S.lesson.id:null,phase:S.phase}:null});
}
function restore(){
  Store.load(function(data){
    if(!data){ offerFirstVisit(); return; }
    if(data.progress&&typeof data.progress==="object")S.progress=data.progress;
    S.saved=data.last||null;
    renderRail();
    if(S.saved&&S.saved.op&&!S.op)offerResume();
    else if(!S.saved) offerFirstVisit();
  });
}
function offerFirstVisit(){
  if(S.op)return;
  var total=0;BOOK.forEach(function(o){total+=o.lines.length;});
  var flagship=BOOK[0];
  setCoach("New here?",
    "Kibitz teaches one opening at a time: watch a variation played with explanations, reproduce it from memory, "+
    "then punish the mistakes your opponent is likely to make. "+total+" variations across "+BOOK.length+" openings, all checked against Stockfish.",
    null,null,
    '<button class="mini go" id="aTry">Try '+esc(flagship.name)+'</button>');
  var b=document.getElementById("aTry");
  if(b)b.onclick=function(){startOpening(flagship.id);};
}
function offerResume(){
  var op=null;BOOK.forEach(function(o){if(o.id===S.saved.op)op=o;});
  if(!op)return;
  var ln=S.saved.lesson?op._byId[S.saved.lesson]:null;
  var done=0;op.lines.forEach(function(l){if(prog(l.id).test>=80)done++;});
  setCoach("Welcome back",
    "You were working through <b>"+esc(op.name)+"</b>"+
    (ln?" \u2014 <b>"+esc(ln.name)+"</b> ("+(S.saved.phase||"learn")+")":"")+
    ". "+done+" of "+op.lines.length+" variations passed.",
    "ok",null,
    '<button class="mini go" id="aResume">Resume</button> <button class="mini" id="aFresh">Start something else</button>');
  var r=document.getElementById("aResume");
  if(r)r.onclick=function(){
    if(ln)startLesson(op.id,ln.id,S.saved.phase||"learn");
    else startOpening(op.id);
  };
  var f=document.getElementById("aFresh");
  if(f)f.onclick=function(){S.tab="course";renderRail();
    setCoach("Choose an opening","Pick one on the right to start.");};
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function lessonMoves(){return S.lesson?S.lesson.moves.trim().split(/\s+/):[];}
function moveLabel(i){return (Math.floor(i/2)+1)+(i%2===0?".":"...");}
function studentToMove(){return S.pos.turn===(S.student==="white"?E.WHITE:E.BLACK);}
function noteAt(i){return S.lesson&&S.lesson.notes?S.lesson.notes[i]:null;}
function prog(id){var p=S.progress[id];return p?{learn:!!p.learn,test:p.test||0,side:!!p.side}:{learn:false,test:0,side:false};}

/* ============================================================
   Board
   ============================================================ */
var boardEl=document.getElementById("board");
function renderBoard(){
  var order=[],r,f;
  for(r=0;r<8;r++)for(f=0;f<8;f++)order.push(r*16+f);
  if(S.orient==="black")order.reverse();
  var chk=S.pos.inCheck()?S.pos.kings[S.pos.turn]:-1,html="";
  for(var i=0;i<order.length;i++){
    var sq=order[i],pc=S.pos.board[sq],file=sq&15,rank=sq>>4;
    var cls="sq "+(((file+rank)%2===1)?"d":"l");
    if(S.last&&(sq===S.last.from||sq===S.last.to))cls+=" last";
    if(sq===S.sel)cls+=" sel";
    if(sq===chk)cls+=" chk";
    if(S.hint&&sq===S.hintFrom)cls+=" hintf";
    if(S.hint>1&&sq===S.hintTo)cls+=" hintt";
    if(S.badSq===sq)cls+=" bad";
    var inner="";
    if(S.legal.indexOf(sq)>=0)inner+=pc?'<span class="ring"></span>':'<span class="dot"></span>';
    if(pc)inner+=pieceSvg(E.type(pc),E.colorOf(pc)===E.WHITE);
    if(S.orient==="white"?rank===7:rank===0)inner+='<span class="co f">'+"abcdefgh"[file]+'</span>';
    if(S.orient==="white"?file===0:file===7)inner+='<span class="co r">'+(8-rank)+'</span>';
    html+='<div class="'+cls+'" data-sq="'+sq+'">'+inner+'</div>';
  }
  html+=arrowSvg();
  boardEl.innerHTML=html;
  var b=document.querySelector(".bar"),h=boardEl.getBoundingClientRect().height;
  if(b&&h>40)b.style.height=Math.round(h)+"px";
}
function arrowSvg(){
  if(!S.arrow)return "";
  var f=S.arrow.from,t=S.arrow.to;
  function cx(sq){var fl=sq&15;return (S.orient==="white"?fl:7-fl)+0.5;}
  function cy(sq){var r=sq>>4;return (S.orient==="white"?r:7-r)+0.5;}
  var x1=cx(f),y1=cy(f),x2=cx(t),y2=cy(t);
  var dx=x2-x1,dy=y2-y1,L=Math.sqrt(dx*dx+dy*dy)||1,ux=dx/L,uy=dy/L;
  var head=0.36,w=0.18;
  var sx=x1+ux*0.30,sy=y1+uy*0.30,ex=x2-ux*head,ey=y2-uy*head;
  var px=-uy,py=ux;
  return '<svg class="arrows" viewBox="0 0 8 8" xmlns="http://www.w3.org/2000/svg">'+
    '<line x1="'+sx+'" y1="'+sy+'" x2="'+ex+'" y2="'+ey+'" stroke="#5EA8A1" stroke-width="0.155" stroke-linecap="round" opacity="0.92"/>'+
    '<polygon points="'+x2+','+y2+' '+(ex+px*w)+','+(ey+py*w)+' '+(ex-px*w)+','+(ey-py*w)+'" fill="#5EA8A1" opacity="0.92"/></svg>';
}
window.addEventListener("resize",renderBoard);
var evalReq=0;
function updateEval(){
  var fen=S.pos.fen(),turn=S.pos.turn,my=++evalReq;
  Analyzer.go(fen,{depth:Analyzer.isSF()?12:3,movetime:Analyzer.isSF()?250:null},function(res){
    if(my!==evalReq)return;
    var cp=whiteCp(res,turn); S.lastEval=cp;
    var pct=Math.abs(cp)>=90000?(cp>0?98:2):Math.max(3,Math.min(97,100/(1+Math.pow(10,-cp/420))));
    var f=document.getElementById("evalFill");if(f)f.style.height=pct+"%";
    var n=document.getElementById("evalNum");if(n)n.textContent=fmtCp(cp).replace("+0.00","0.00");
  });
}

/* ============================================================
   Moving
   ============================================================ */
function doMove(m){
  var san=S.pos.san(m);
  S.pos.make(m);
  S.path.push({san:san,move:m});
  if(S.node&&S.node.kids[san])S.node=S.node.kids[san];else S.node=null;
  S.last={from:m.from,to:m.to};S.sel=-1;S.legal=[];S.hint=0;S.badSq=-1;S.arrow=null;
  renderBoard();renderRail();updateEval();
  return san;
}
function resetTo(n){
  var keep=S.path.slice(0,n);
  S.pos=new E.Position();S.node=S.op?S.op._tree:null;S.path=[];S.last=null;
  keep.forEach(function(t){var m=S.pos.moveFromSan(t.san);if(m)doMove(m);});
  S.sel=-1;S.legal=[];S.hint=0;S.badSq=-1;
}

/* ============================================================
   Coach
   ============================================================ */
function setCoach(lbl,txt,kind,sub,acts,why,phase){
  var c=document.getElementById("coach");
  c.className="coach"+(kind?" "+kind:"");
  document.getElementById("coachLbl").textContent=lbl;
  document.getElementById("coachPhase").textContent=phase||"";
  document.getElementById("coachTxt").innerHTML=txt;
  var s=c.querySelector(".sub");if(s)s.remove();
  if(sub){var d=document.createElement("div");d.className="sub";d.textContent=sub;
    c.insertBefore(d,document.getElementById("coachActs"));}
  document.getElementById("coachActs").innerHTML=acts||"";
  document.getElementById("whyBox").innerHTML=why||"";
}
var prevAt=0, prevQueued=null;
function setPrev(html){
  var e=document.getElementById("coachPrev");
  if(prevQueued){clearTimeout(prevQueued);prevQueued=null;}
  if(!e)return;
  e.innerHTML=html||"";
  e.style.display=html?"block":"none";
  prevAt=Date.now();
}
var PREV_MIN_MS=1200;
function pushPrev(i){
  // an annotated move supersedes the strip; a quiet move leaves the last
  // explanation on screen, so nothing is lost to a fast click. An annotation
  // also cannot be replaced before it has been readable for PREV_MIN_MS.
  if(!(i>=0&&i<S.path.length&&noteAt(i)))return;
  var html=prevFor(i), waitFor=PREV_MIN_MS-(Date.now()-prevAt), g=S.gen;
  if(prevQueued){clearTimeout(prevQueued);prevQueued=null;}
  if(waitFor<=0){setPrev(html);return;}
  prevQueued=setTimeout(function(){
    prevQueued=null;
    if(g===S.gen)setPrev(html);
  },waitFor);
}
function prevFor(i){
  if(i<0||i>=S.path.length)return "";
  var note=noteAt(i);
  return '<b>'+moveLabel(i)+' '+esc(S.path[i].san)+'</b>'+(note?esc(note):"");
}
function phaseLabel(){
  if(S.mode!=="course"||!S.lesson)return "";
  if(S.phase==="side")return "SIDELINE \u00b7 "+(S.drillIdx+1)+"/"+S.drills.length;
  return (S.phase==="learn"?"LEARN":"TEST")+" \u00b7 "+
    (S.path.length<lessonMoves().length?("move "+(Math.floor(S.path.length/2)+1)):"end");
}

/* ============================================================
   Course flow: main line first, then one variation at a time,
   each taught (learn) and then examined (test).
   ============================================================ */
function lessonList(op){return op.lines;}
function startOpening(opId){
  var op=null;BOOK.forEach(function(o){if(o.id===opId)op=o;});
  if(!op)return;
  S.op=op; S.student=op.side==="black"?"black":"white";
  var list=lessonList(op),pick=list[0],ph="learn";
  for(var i=0;i<list.length;i++){
    var p=prog(list[i].id);
    if(!p.learn){pick=list[i];ph="learn";break;}
    if(p.test<80){pick=list[i];ph="test";break;}
    if(i===list.length-1){pick=list[i];ph="test";}
  }
  startLesson(op.id,pick.id,ph);
}
function startLesson(opId,lineId,phase){
  var op=null;BOOK.forEach(function(o){if(o.id===opId)op=o;});
  if(!op)return;
  S.gen++; if(S.timer){clearTimeout(S.timer);S.timer=null;} S.busy=false;
  S.op=op; S.lesson=op._byId[lineId]; S.phase=phase||"learn";
  S.student=op.side==="black"?"black":"white";
  S.orient=S.student;
  S.pos=new E.Position(); S.path=[]; S.node=op._tree;
  S.sel=-1;S.legal=[];S.last=null;S.hint=0;S.badSq=-1;
  S.right=0;S.wrong=0;S.mistakes=[];S.finished=false;
  S.drills=sidelinesFor(op,S.lesson);S.drillIdx=0;S.drillWrong=0;
  S.mode="course"; setModeButtons(); setPrev("");
  if(S.tab==="course"||S.tab==="line"){/*keep*/}else S.tab="course";
  renderBoard();updateEval();renderRail();
  persist();
  if(S.phase==="side"){beginDrill();return;}
  step();
}

/* ---------------- sideline drills ---------------- */
function beginDrill(){
  if(!S.drills.length){
    setCoach("No sidelines here","This variation has no drilled opponent mistakes yet. Try another lesson.",null,null,"",null,"");
    return;}
  if(S.drillIdx>=S.drills.length){finishDrills();return;}
  var e=S.drills[S.drillIdx];
  S.pos=new E.Position();S.path=[];S.node=S.op._tree;
  e.pre.trim().split(/\s+/).forEach(function(sn){var m=S.pos.moveFromSan(sn);if(m)doMove(m);});
  S.drillSeq=e.pun.trim().split(/\s+/);S.drillStep=0;
  S.sel=-1;S.legal=[];S.hint=0;S.badSq=-1;S.finished=false;S.arrow=null;
  setPrev("");
  renderBoard();
  setCoach("Sideline "+(S.drillIdx+1)+" of "+S.drills.length,
    "Your opponent is about to go wrong. Watch…",null,null,"",null,phaseLabel());
  var g=S.gen;
  S.timer=setTimeout(function(){
    if(g!==S.gen)return;
    var m=S.pos.moveFromSan(e.bad);
    if(m){doMove(m);setPrev('<b>'+moveLabel(S.path.length-1)+' '+esc(e.bad)+'</b>');}
    promptDrill();
  },900);
}
function revealMove(san,label){
  var m=S.pos.moveFromSan(san);
  if(!m)return null;
  S.arrow={from:m.from,to:m.to};
  S.hint=2;S.hintFrom=m.from;S.hintTo=m.to;
  renderBoard();
  return m;
}
function promptDrill(){
  var e=S.drills[S.drillIdx];
  setCoach("Punish it",
    "Your opponent has just played <b>"+esc(e.bad)+"</b>. What is the strongest answer?",
    null,null,'<button class="mini" id="aDrillHint">Hint</button> <button class="mini" id="aDrillSkip">Show me</button>',
    null,phaseLabel());
  var h=document.getElementById("aDrillHint");
  if(h)h.onclick=function(){
    var m=S.pos.moveFromSan(S.drillSeq[S.drillStep]);
    if(!m)return;
    S.arrow=null;S.hint=1;S.hintFrom=m.from;S.hintTo=m.to;renderBoard();
    setCoach("Hint","The piece to move is highlighted \u2014 now find the square.",
      null,null,'<button class="mini" id="aDrillSkip2">Show me the move</button>',null,phaseLabel());
    var k2=document.getElementById("aDrillSkip2");
    if(k2)k2.onclick=showDrillMove;
  };
  var k=document.getElementById("aDrillSkip");
  if(k)k.onclick=showDrillMove;
}
function showDrillMove(){
  var san=S.drillSeq[S.drillStep];
  if(!revealMove(san))return;
  setCoach("The move is "+san,
    "It is marked on the board. Play it yourself to continue \u2014 the move sticks better than the answer.",
    null,null,'<button class="mini" id="aDrillPlay">Play it for me</button>',null,phaseLabel());
  var b=document.getElementById("aDrillPlay");
  if(b)b.onclick=function(){
    var m=S.pos.moveFromSan(san);
    if(m)drillCorrect(m,san,true);
  };
}
function drillCorrect(m,san,shown){
  doMove(m);S.drillStep++;
  if(S.drillStep>=S.drillSeq.length){drillDone(shown);return;}
  setCoach(shown?("Shown: "+san):("Correct \u2014 "+san),"",shown?null:"ok",null,"",null,phaseLabel());
  var g=S.gen;
  S.timer=setTimeout(function(){
    if(g!==S.gen)return;
    var r=S.pos.moveFromSan(S.drillSeq[S.drillStep]);
    if(r){doMove(r);S.drillStep++;}
    if(S.drillStep>=S.drillSeq.length)drillDone(shown);else promptDrill();
  },700);
}
function drillDone(shown){
  var e=S.drills[S.drillIdx];
  var more=(S.drillIdx+1<S.drills.length);
  setCoach(shown?"Sideline shown":"Punished",esc(e.why),shown?null:"ok",
    e.bestWhy?("They should have played "+e.best):null,
    (more?'<button class="mini go" id="aDrillNext">Next sideline</button> ':'<button class="mini go" id="aDrillNext">Finish</button> ')+
    '<button class="mini" id="aDrillAgain">Try this one again</button>',
    null,phaseLabel());
  var n=document.getElementById("aDrillNext");
  if(n)n.onclick=function(){S.drillIdx++;S.gen++;beginDrill();};
  var a=document.getElementById("aDrillAgain");
  if(a)a.onclick=function(){S.gen++;beginDrill();};
}
function drillWrong(m,san){
  var before=S.pos.clone(),e=S.drills[S.drillIdx];
  S.drillWrong++;
  S.badSq=m.to;boardEl.classList.add("shake");
  setTimeout(function(){boardEl.classList.remove("shake");S.badSq=-1;renderBoard();},420);
  renderBoard();
  setCoach("Not the punishment","Checking <b>"+esc(san)+"</b>\u2026","err",null,"",null,phaseLabel());
  diagnose(before,m,san,function(d){
    setCoach("Not the punishment",
      "<b>"+esc(san)+"</b> is playable, but there is something stronger here.",
      "err",d.costLabel,'<button class="mini go" id="aDW">Try again</button> <button class="mini" id="aDS">Show me</button>',
      whyHtml(d,null),phaseLabel());
    var r=document.getElementById("aDW");if(r)r.onclick=promptDrill;
    var k=document.getElementById("aDS");
    if(k)k.onclick=showDrillMove;
  });
}
function finishDrills(){
  S.finished=true;
  var id=S.lesson.id,p=prog(id);
  p.side=true;S.progress[id]=p;persist();
  var nxt=nextLesson();
  setCoach("Sidelines complete",
    "You have punished every drilled mistake in <b>"+esc(S.lesson.name)+"</b>."+
    (nxt?" That completes this variation.":" That was the last variation."),"ok",null,
    (nxt?'<button class="mini go" id="aNext3">Next: '+esc(nxt.name)+'</button> ':'')+
    '<button class="mini" id="aAgain3">Run the sidelines again</button>',null,"");
  var n=document.getElementById("aNext3");
  if(n)n.onclick=function(){startLesson(S.op.id,nxt.id,"learn");};
  var a=document.getElementById("aAgain3");
  if(a)a.onclick=function(){startLesson(S.op.id,id,"side");};
  renderRail();
}
/* advance the position: play opponent moves automatically, prompt on ours */
function step(){
  if(S.mode!=="course"||!S.lesson)return;
  var mv=lessonMoves();
  if(S.path.length>=mv.length){finishLesson();return;}
  if(studentToMove()){promptStudent();return;}
  // opponent move
  S.busy=true;
  var g=S.gen;
  S.timer=setTimeout(function(){
    if(g!==S.gen)return;
    var san=mv[S.path.length];
    if(!san){S.busy=false;finishLesson();return;}
    var m=S.pos.moveFromSan(san);
    if(!m){S.busy=false;return;}
    doMove(m);
    S.busy=false;
    var note=noteAt(S.path.length-1);
    if(S.phase==="learn"){
      // the annotation goes in the persistent strip so the next prompt cannot wipe it
      pushPrev(S.path.length-1);
      setCoach("Opponent plays "+san,"",null,null,"",null,phaseLabel());
      var g2=S.gen;S.timer=setTimeout(function(){if(g2===S.gen)step();},note?900:500);
    }else{
      setCoach("Opponent plays "+san,"",null,null,"",null,phaseLabel());
      var g3=S.gen;S.timer=setTimeout(function(){if(g3===S.gen)step();},450);
    }
  },S.path.length===0?250:500);
}
function promptStudent(){
  var mv=lessonMoves(),want=mv[S.path.length],note=noteAt(S.path.length);
  if(!want){finishLesson();return;}
  if(S.phase==="learn"){
    setCoach("Your move: "+want,
      note?esc(note):"Play <b>"+esc(want)+"</b> to continue the line.",
      null,null,
      '<button class="mini go" id="aShow">Play it for me</button>',
      null,phaseLabel());
    var a=document.getElementById("aShow");
    if(a)a.onclick=function(){playStudentMove(S.pos.moveFromSan(want),want,true);};
  }else{
    setCoach("Your move","What does the line play here? "+
      (S.right+S.wrong?("<span style=\"color:var(--ink3)\">"+S.right+"/"+(S.right+S.wrong)+" so far</span>"):""),
      null,null,'<button class="mini" id="aHint">Hint</button>',null,phaseLabel());
    var h=document.getElementById("aHint");
    if(h)h.onclick=doHint;
  }
}
function playStudentMove(m,san,shown){
  if(!m)return;
  doMove(m);
  if(S.phase==="learn"){
    var note=noteAt(S.path.length-1);
    pushPrev(S.path.length-1);
    setCoach((shown?"Shown: ":"Good \u2014 ")+san,note?"":"Correct.",shown?null:"ok",null,"",null,phaseLabel());
    var g=S.gen;S.timer=setTimeout(function(){if(g===S.gen)step();},note?1100:700);
  }else{
    S.right++;
    setCoach("Correct \u2014 "+san,"",'ok',null,"",null,phaseLabel());
    var g2=S.gen;S.timer=setTimeout(function(){if(g2===S.gen)step();},450);
  }
}
function wrongMove(m,san){
  var mv=lessonMoves(),want=mv[S.path.length];
  if(!want){finishLesson();return;}
  var before=S.pos.clone();
  S.badSq=m.to;boardEl.classList.add("shake");
  setTimeout(function(){boardEl.classList.remove("shake");S.badSq=-1;renderBoard();},420);
  renderBoard();
  if(S.phase==="test"){S.wrong++;S.mistakes.push({ply:S.path.length,played:san,want:want});}
  var trap=null;
  (S.op._traps[fenKey(before)]||[]).forEach(function(t){if(t.bad===san)trap=t;});
  setCoach("Not this line","Checking <b>"+esc(san)+"</b> with the engine\u2026","err",null,"",null,phaseLabel());
  diagnose(before,m,san,function(d){
    var acts='<button class="mini go" id="aRetry">Try again</button>'+
             (trap?' <button class="mini" id="aTrap">Show the refutation</button>':'');
    setCoach("Not this line",
      "<b>"+esc(san)+"</b> is not the move here. The line plays <b>"+esc(want)+"</b>"+
      (noteAt(S.path.length)?": "+esc(noteAt(S.path.length)):"."),
      "err",d.costLabel,acts,whyHtml(d,trap),phaseLabel());
    var r=document.getElementById("aRetry");
    if(r)r.onclick=function(){ promptStudent(); };
    var t=document.getElementById("aTrap");
    if(t&&trap)t.onclick=function(){ showRefutation(trap,san); };
  });
}
function finishLesson(){
  S.finished=true;
  var id=S.lesson.id,p=prog(id);
  if(S.phase==="learn"){
    p.learn=true;S.progress[id]=p;persist();
    setCoach("Lesson complete","You have walked through <b>"+esc(S.lesson.name)+"</b> with help. "+
      "Now try it from memory.","ok",null,

/* ============================================================
   Diagnosis (async, engine-backed)
   ============================================================ */
function principleFlags(pos,move){
  var out=[],ply=S.path.length,t=E.type(move.piece);
  if(ply>=24)return out;
  var mine=[],i;
  for(i=ply%2===0?0:1;i<S.path.length;i+=2)mine.push(S.path[i]);
  if(t===E.QUEEN){
    var minors=0;mine.forEach(function(x){var tt=E.type(x.move.piece);if(tt===E.KNIGHT||tt===E.BISHOP)minors++;});
    if(minors<2&&ply<14)out.push("The queen comes out before the minor pieces. She can be chased with tempo, and every attack on her develops a piece for free.");
  }
  for(i=0;i<mine.length;i++)
    if(mine[i].move.to===move.from&&E.type(mine[i].move.piece)===t&&t!==E.PAWN){
      out.push("This moves the same piece twice in the opening while others are still at home.");break;}
  if(t===E.KNIGHT&&((move.to&15)===0||(move.to&15)===7))
    out.push("A knight on the edge controls half as many squares as one in the centre.");
  if(t===E.PAWN){
    var pawns=0;mine.forEach(function(x){if(E.type(x.move.piece)===E.PAWN)pawns++;});
    if(pawns>=3&&ply<16)out.push("That is a fourth pawn move in the opening \u2014 each one is a move not spent developing.");
  }
  return out;
}
function diagnose(pos,move,san,cb){
  var turn=pos.turn,sign=turn===E.WHITE?1:-1;
  var fenBefore=pos.fen();
  var nx=pos.clone();nx.make(move);
  var fenAfter=nx.fen();
  var d={cost:0,reasons:[],costLabel:null};
  var deep=Analyzer.isSF()?14:3;
  Analyzer.go(fenBefore,{depth:deep},function(a){
    var before=whiteCp(a,turn);
    Analyzer.go(fenAfter,{depth:deep},function(b){
      var after=whiteCp(b,nx.turn);
      d.cost=Math.round((before-after)*sign);
      if(d.cost>=50)d.costLabel="engine: "+(d.cost/100).toFixed(2)+" pawns worse than the book move";
      var reply=b.best?uciToMove(nx.clone(),b.best):null;
      if(reply){
        var rsan=nx.clone().san(reply);
        if(reply.captured&&(E.VAL[E.type(reply.captured)]||0)>=300)
          d.reasons.push("The reply <b>"+esc(rsan)+"</b> wins material at once.");
        else if(d.cost>=60)
          d.reasons.push("The engine answers <b>"+esc(rsan)+"</b> and the position turns against you.");
      }
      var loose=E.loosePieces(nx,turn);
      if(loose.length&&E.VAL[loose[0].type]>=300)
        d.reasons.push("It leaves the "+E.pieceName(loose[0].type)+" on "+E.alg(loose[0].sq)+" "+
          (loose[0].info.undefended?"undefended":"defended only by a more valuable piece")+".");
      principleFlags(pos,move).forEach(function(r){d.reasons.push(r);});
      cb(d);
    });
  });
}
function whyHtml(d,trap){
  var h='<div class="why">';
  if(trap){
    var kl={practical:"PRACTICAL TRAP",positional:"POSITIONAL INACCURACY"}[trap.kind];
    h+='<b>'+esc(trap.name)+'</b> '+(kl?'<span style="color:var(--ink3);font-family:var(--mono);font-size:10px">'+kl+'</span>':'')+'<br>'+esc(trap.why);
    if(trap.caveat)h+='<br><span style="color:var(--ink3);font-size:11.5px">'+esc(trap.caveat)+'</span>';
    if(trap.bestWhy)h+='<br><br><b>Instead:</b> '+esc(trap.bestWhy);
  }else if(d){
    if(d.cost>=150)h+='<b>That is a serious mistake.</b> ';
    else if(d.cost>=50)h+='<b>That loses about '+(d.cost/100).toFixed(1)+' pawns.</b> ';
    else h+='<b>Not a blunder \u2014 but not the move this line plays.</b> ';
    if(d.reasons.length){h+='<ul>';d.reasons.forEach(function(r){h+='<li>'+r+'</li>';});h+='</ul>';}
    else h+='It is playable; it simply leaves the variation you are learning.';
  }
  return h+'</div>';
}
function showRefutation(trap,san){
  var savePath=S.path.slice(),savePhase=S.phase;
  S.gen++;var g=S.gen;
  var m=S.pos.moveFromSan(trap.bad);
  if(m)doMove(m);
  var seq=(trap.pun||"").trim().split(/\s+/).filter(Boolean),i=0;
  function tick(){
    if(g!==S.gen)return;
    if(i>=seq.length){
      var over=S.pos.moves().length===0&&S.pos.inCheck();
      setCoach("Refutation",(over?"Checkmate. ":"")+esc(trap.why),"err",null,
        '<button class="mini go" id="aBack">Back to the lesson</button>',null,"");
      document.getElementById("aBack").onclick=function(){
        S.gen++;S.phase=savePhase;resetTo(0);
        savePath.forEach(function(t){var mm=S.pos.moveFromSan(t.san);if(mm)doMove(mm);});
        renderBoard();promptStudent();
      };
      return;
    }
    var mm=S.pos.moveFromSan(seq[i]);if(!mm)return;
    doMove(mm);i++;S.timer=setTimeout(tick,760);
  }
  setCoach("Refutation","<b>"+esc(trap.name)+"</b> \u2014 watch what follows.","err",null,"",null,"");
  S.timer=setTimeout(tick,700);
}

   ============================================================ */
function engineMove(){
  if(S.busy)return;S.busy=true;
  var g=S.gen,skill=+document.getElementById("level").value;
  setCoach("Engine","Thinking\u2026",null,null,"",null,"");
  Analyzer.go(S.pos.fen(),{skill:skill,movetime:Analyzer.isSF()?(400+skill*60):700,depth:Analyzer.isSF()?null:4},function(res){
    if(g!==S.gen){S.busy=false;return;}
    S.busy=false;
    var m=res.best?uciToMove(S.pos,res.best):null;
    if(!m){checkEnd();return;}
    S.engineInfo={san:S.pos.san(m),depth:res.depth,cp:whiteCp(res,S.pos.turn)};
    var san=doMove(m);
    if(!checkEnd())setCoach("Your move","Engine played <b>"+esc(san)+"</b>.",null,null,"",null,"");
  });
}
function checkEnd(){
  if(S.pos.moves().length===0){
    setCoach(S.pos.inCheck()?"Checkmate":"Stalemate",
      S.pos.inCheck()?((S.pos.turn===E.WHITE?"Black":"White")+" wins."):"Drawn.","ok",null,"",null,"");
    return true;}
  return false;
}

boardEl.addEventListener("click",function(ev){
  var cell=ev.target.closest("[data-sq]");
  if(!cell||S.busy)return;
  onSquare(+cell.getAttribute("data-sq"));
});
function canMoveNow(){
  if(S.mode==="explore")return true;
  if(S.mode==="play")return S.pos.turn===(S.orient==="white"?E.WHITE:E.BLACK);
  if(!S.lesson||S.finished)return false;
  if(S.phase==="side")return studentToMove()&&S.drillStep<S.drillSeq.length;
  return studentToMove();
}
function onSquare(sq){
  if(S.sel>=0&&S.legal.indexOf(sq)>=0){
    var m=S.pos.moveFromSquares(S.sel,sq);
    if(m&&m.promo){askPromo(S.sel,sq);return;}
    if(m)userMove(m);return;
  }
  var pc=S.pos.board[sq];
  if(pc&&E.colorOf(pc)===S.pos.turn&&canMoveNow()){
    S.sel=sq;
    S.legal=S.pos.moves().filter(function(m){return m.from===sq;}).map(function(m){return m.to;});
  }else{S.sel=-1;S.legal=[];}
  renderBoard();
}
function askPromo(from,to){
  var el=document.getElementById("promo");el.style.display="flex";el.innerHTML="";
  [5,4,3,2].forEach(function(t){
    var b=document.createElement("button");
    b.innerHTML=pieceSvg(t,S.pos.turn===E.WHITE);
    b.title="Promote to "+PNAME[t];
    b.onclick=function(){el.style.display="none";var m=S.pos.moveFromSquares(from,to,t);if(m)userMove(m);};
    el.appendChild(b);});
}
function userMove(m){
  var san=S.pos.san(m);
  if(S.mode==="play"){doMove(m);if(!checkEnd())engineMove();return;}
  if(S.mode==="explore"){
    var wasBook=S.node&&S.node.kids[san];
    doMove(m);
    if(wasBook)exploreCoach();
    else{
      var before=new E.Position();
      S.path.slice(0,-1).forEach(function(t){before.make(before.moveFromSan(t.san));});
      setCoach("Off book","Checking <b>"+esc(san)+"</b>\u2026",null,null,"",null,"");
      diagnose(before,m,san,function(d){
        setCoach("Off book","<b>"+esc(san)+"</b> is not in this repertoire.","",d.costLabel,
          '<button class="mini" id="aUndo">Take it back</button>',whyHtml(d,null),"");
        document.getElementById("aUndo").onclick=function(){resetTo(S.path.length-1);renderBoard();exploreCoach();};
      });
    }
    return;
  }
  // course — cancel any queued step so feedback cannot be overwritten
  if(S.timer){clearTimeout(S.timer);S.timer=null;}
  if(S.phase==="side"){
    if(S.finished)return;
    if(san===S.drillSeq[S.drillStep])drillCorrect(m,san,false);
    else drillWrong(m,san);
    return;
  }
  var want=lessonMoves()[S.path.length];
  if(san===want)playStudentMove(m,san,false);
  else wrongMove(m,san);
}
function exploreCoach(){
  if(!S.node){setCoach("Off book","Step back to rejoin the repertoire.",null,null,"",null,"");return;}
  var kids=S.node.order.length;
  var last=S.path.length?S.path[S.path.length-1]:null;
  if(!last){setCoach(S.op?S.op.name:"Explore","Play through any branch. The Line tab lists every book continuation from here.");return;}
  setCoach(moveLabel(S.path.length-1)+" "+last.san,
    S.node.note?esc(S.node.note):(kids?("Branch point: "+kids+" book continuation"+(kids>1?"s":"")+" from here."):"End of the line."));
}

        if(idx%2===0)txt+=(Math.floor(idx/2)+1)+". ";else if(i===0)txt+=(Math.floor(idx/2)+1)+"... ";
        txt+=s+" ";});
      out.innerHTML='<div class="eng-row"><span class="k">Best</span><span class="v">'+esc(san[0]||"\u2014")+'</span></div>'+
        '<div class="eng-row"><span class="k">Score</span><span class="v">'+fmtCp(whiteCp(res,turn))+' (White)</span></div>'+
        '<div class="eng-row"><span class="k">Depth</span><span class="v">'+res.depth+'</span></div>'+
        '<div class="pv">'+esc(txt.trim())+'</div>';
    });
  };
}
pane.addEventListener("click",function(ev){
  var p=ev.target.closest("[data-op]");
  if(p){startOpening(p.getAttribute("data-op"));return;}
  var l=ev.target.closest("[data-lesson]");
  if(l){var id=l.getAttribute("data-lesson"),pr=prog(id);
    var ph=!pr.learn?"learn":(pr.test<80?"test":(sidelinesFor(S.op,S.op._byId[id]).length&&!pr.side?"side":"learn"));
    startLesson(S.op.id,id,ph);return;}
  var g=ev.target.closest("[data-go]");
  if(g){var m=S.pos.moveFromSan(g.getAttribute("data-go"));if(m){doMove(m);exploreCoach();}return;}
  var pl=ev.target.closest("[data-ply]");
  if(pl&&S.mode==="explore"){resetTo(+pl.getAttribute("data-ply"));renderBoard();exploreCoach();return;}
  var su=ev.target.closest("[data-setup]");
  if(su){
    var nm=su.getAttribute("data-setup"),tr=null;
    (S.op.traps||[]).forEach(function(x){if(x.name===nm)tr=x;});
    if(!tr)return;
    setMode("explore");
    S.pos=new E.Position();S.path=[];S.node=S.op._tree;
    tr.pre.trim().split(/\s+/).forEach(function(s){var mm=S.pos.moveFromSan(s);if(mm)doMove(mm);});
    S.orient=(tr.pre.trim().split(/\s+/).length%2===0)?"white":"black";
    renderBoard();S.tab="line";renderRail();
    var verb={positional:"is the inaccuracy",practical:"is the tempting mistake"}[tr.kind]||"is the losing try";
    setCoach(tr.name,"It is "+(S.pos.turn===E.WHITE?"White":"Black")+" to move. <b>"+esc(tr.bad)+"</b> "+verb+".",
      "err",null,'<button class="mini go" id="aPlayTrap">Play the refutation</button>',whyHtml(null,tr),"");
    var b=document.getElementById("aPlayTrap");
    if(b)b.onclick=function(){showRefutation(tr,tr.bad);};
  }
});

/* ============================================================
   Modes & controls
   ============================================================ */
function setModeButtons(){
  document.getElementById("mCourse").setAttribute("aria-pressed",S.mode==="course");
  document.getElementById("mExplore").setAttribute("aria-pressed",S.mode==="explore");
  document.getElementById("mPlay").setAttribute("aria-pressed",S.mode==="play");
  document.getElementById("bShow").disabled=(S.mode!=="course");
  document.getElementById("bRestart").disabled=(S.mode!=="course"||!S.lesson);
}
function setMode(m){
  S.gen++;if(S.timer){clearTimeout(S.timer);S.timer=null;}S.busy=false;
  S.mode=m;setModeButtons();setPrev("");
  if(m==="course"){
    if(S.op&&S.lesson)startLesson(S.op.id,S.lesson.id,S.phase);
    else{S.tab="course";renderRail();setCoach("Choose an opening","Pick one on the right to start the course.");}
    return;
  }
  if(m==="explore"){S.tab="line";renderRail();exploreCoach();return;}
  if(m==="play"){
    S.orient=S.pos.turn===E.WHITE?"white":"black";
    renderBoard();renderRail();
    setCoach("Play from here","You are "+S.orient+" and it is your move. The engine takes the other side.","ok");
  }
}
document.getElementById("mCourse").onclick=function(){setMode("course");};
document.getElementById("mExplore").onclick=function(){setMode("explore");};
document.getElementById("mPlay").onclick=function(){setMode("play");};
["tCourse","tLine","tIdeas","tEng"].forEach(function(id,i){
  document.getElementById(id).onclick=function(){S.tab=["course","line","ideas","eng"][i];renderRail();};});
document.getElementById("bShow").onclick=function(){
  if(S.mode!=="course"||!S.lesson||S.finished)return;
  if(S.phase==="side"){showDrillMove();return;}
  if(!studentToMove())return;
  var want=lessonMoves()[S.path.length];
  if(!want){finishLesson();return;}
  if(S.phase==="test"){doHint();return;}
  if(!revealMove(want))return;
  setCoach("The move is "+want,
    (noteAt(S.path.length)?esc(noteAt(S.path.length))+" ":"")+"It is marked on the board \u2014 play it to continue.",
    null,null,'<button class="mini" id="aPlayIt">Play it for me</button>',null,phaseLabel());
  var b=document.getElementById("aPlayIt");
  if(b)b.onclick=function(){playStudentMove(S.pos.moveFromSan(want),want,true);};
};
document.getElementById("bPrev").onclick=function(){
  if(S.mode==="course"){if(S.path.length){resetTo(S.path.length-1);renderBoard();setPrev(prevFor(S.path.length-1));promptStudent();}return;}
  if(S.path.length){resetTo(S.path.length-1);renderBoard();exploreCoach();}
};
document.getElementById("bNext").onclick=function(){
  if(S.mode==="course"){
    if(S.phase==="side"){
      var sn=S.drillSeq[S.drillStep],mm=sn?S.pos.moveFromSan(sn):null;
      if(mm)drillCorrect(mm,sn,true);
      return;
    }
    if(!studentToMove()||S.finished)return;
    var w=lessonMoves()[S.path.length];
    if(w)playStudentMove(S.pos.moveFromSan(w),w,true);
    return;
  }
  if(S.node&&S.node.order.length){var m=S.pos.moveFromSan(S.node.order[0]);if(m){doMove(m);exploreCoach();}}
};
document.getElementById("bFlip").onclick=function(){S.orient=S.orient==="white"?"black":"white";renderBoard();};
document.getElementById("bRestart").onclick=function(){if(S.lesson)startLesson(S.op.id,S.lesson.id,S.phase);};
document.addEventListener("keydown",function(e){
  if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT")return;
  if(e.key==="ArrowLeft"){document.getElementById("bPrev").click();e.preventDefault();}
  else if(e.key==="ArrowRight"){document.getElementById("bNext").click();e.preventDefault();}
  else if(e.key==="f"||e.key==="F")document.getElementById("bFlip").click();
});
var tip=document.getElementById("tip");
document.addEventListener("mouseover",function(e){
  var t=e.target.closest("[data-tip]");if(!t)return;
  tip.innerHTML=(t.getAttribute("data-tiptitle")?"<b>"+esc(t.getAttribute("data-tiptitle"))+"</b>":"")+esc(t.getAttribute("data-tip"));
  tip.classList.add("on");
  var r=t.getBoundingClientRect();
  tip.style.left=Math.min(window.innerWidth-300,Math.max(8,r.left))+"px";
  tip.style.top=Math.max(8,r.top-8-tip.getBoundingClientRect().height)+"px";
});
document.addEventListener("mouseout",function(e){if(e.target.closest("[data-tip]"))tip.classList.remove("on");});
// touch devices don't fire hover events, so tapping a tip target toggles it instead
var tipPinnedEl=null;
document.addEventListener("touchstart",function(e){
  var t=e.target.closest("[data-tip]");
  if(!t){ if(tipPinnedEl){tip.classList.remove("on");tipPinnedEl=null;} return; }
  if(tipPinnedEl===t){ tip.classList.remove("on");tipPinnedEl=null;return; }
  tip.innerHTML=(t.getAttribute("data-tiptitle")?"<b>"+esc(t.getAttribute("data-tiptitle"))+"</b>":"")+esc(t.getAttribute("data-tip"));
  tip.classList.add("on");tipPinnedEl=t;
  var r=t.getBoundingClientRect();
  tip.style.left=Math.min(window.innerWidth-300,Math.max(8,r.left))+"px";
  tip.style.top=Math.max(8,r.top-8-tip.getBoundingClientRect().height)+"px";
},{passive:true});

/* boot */
setModeButtons();renderBoard();renderRail();
// a neutral placeholder until restore() decides between first-visit / resume / nothing-saved
setCoach("Welcome","Pick an opening on the right. Each opening is taught one variation at a time: first the main line with help, then the same line from memory.");
restore();
Analyzer.onReady(function(){updateEval();if(S.tab==="eng")renderRail();});
var rb0=document.getElementById("eng-retry");
if(rb0)rb0.onclick=function(){
  rb0.style.display="none";
  Analyzer.retry();
  Analyzer.onReady(function(){updateEval();if(S.tab==="eng")renderRail();});
};
window.__K=S;window.__A=Analyzer;
})();
